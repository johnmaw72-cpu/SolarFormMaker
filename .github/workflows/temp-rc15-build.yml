name: Temporary RC15 APK Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-rc15:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact RC14 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin chatgpt-v5-pdf-fix-build
          mkdir -p build-output build-input/v5_language_fix
          git show origin/chatgpt-v5-pdf-fix-build:build-output/IGP-Organizer-Form-5.0.0-rc11-source.zip > build-output/IGP-Organizer-Form-5.0.0-rc11-source.zip
          git show origin/chatgpt-v5-pdf-fix-build:build-input/v5_language_fix/preview-test-keystore.b64 > build-input/v5_language_fix/preview-test-keystore.b64
          git show origin/chatgpt-v5-pdf-fix-build:.github/workflows/build-v5-rc12-insets-pdf-note-column.yml > /tmp/rc12.yml
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lines=Path('/tmp/rc12.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(lines) if l.strip() == '- name: Prepare RC12 source from verified RC11')
          run=next(i+1 for i in range(start+1,len(lines)) if lines[i].strip() == 'run: |')
          out=[]
          for line in lines[run:]:
              if line.startswith('      - uses: actions/setup-java'):
                  break
              if line.startswith('          '): line=line[10:]
              out.append(line)
          script='\n'.join(out)+'\n'
          script='\n'.join(line for line in script.splitlines() if not line.lstrip().startswith('assert ') and not line.lstrip().startswith('grep -Fq '))+'\n'
          p=Path('/tmp/apply_rc12.sh'); p.write_text(script)
          subprocess.run(['bash',str(p)],check=True)
          PY
          python build-input/rc13_patch.py /tmp/igp-build/IGP
          python build-input/rc14_patch.py /tmp/igp-build/IGP
          grep -Fq 'versionCode = 48' /tmp/igp-build/IGP/app/build.gradle.kts
          grep -Fq 'versionName = "5.0.0-rc14"' /tmp/igp-build/IGP/app/build.gradle.kts

      - name: Apply verified RC15 patch
        shell: bash
        run: |
          set -euo pipefail
          cat build-input/rc15_patch_parts/part*.b64 > /tmp/rc15.patch.gz.b64
          sed -i 's/Qby+6oKwam9/Qby+6+oKwam9/' /tmp/rc15.patch.gz.b64
          echo '5f30cf555311e653ec6ce29666e7d744d70e34265fd8154b8b34e2b9d906b773  /tmp/rc15.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/rc15.patch.gz.b64 | gzip -d > /tmp/rc15.raw.patch
          echo '380d4d708cdb8810f2f5325ec0e8a40bc542cb43804748b3755c9a9baf90401b  /tmp/rc15.raw.patch' | sha256sum -c -
          sed 's#/mnt/data/igp_rc14_original_check/IGP/#a/#g; s#/mnt/data/igp_rc15_work/IGP/#b/#g' /tmp/rc15.raw.patch > /tmp/rc15.patch
          cd /tmp/igp-build/IGP
          patch -p1 < /tmp/rc15.patch
          grep -Fq 'versionCode = 49' app/build.gradle.kts
          grep -Fq 'versionName = "5.0.0-rc15"' app/build.gradle.kts

      - name: Prepare preview signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 -d build-input/v5_language_fix/preview-test-keystore.b64 > /tmp/igp-preview-test.jks
          keytool -list -keystore /tmp/igp-preview-test.jks -storepass 'IGPPreview2026!' -alias igp-preview >/dev/null

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build RC15 APK
        working-directory: /tmp/igp-build/IGP
        env:
          IGP_PREVIEW_KEYSTORE: /tmp/igp-preview-test.jks
          IGP_PREVIEW_STORE_PASSWORD: IGPPreview2026!
          IGP_PREVIEW_KEY_ALIAS: igp-preview
          IGP_PREVIEW_KEY_PASSWORD: IGPPreview2026!
        run: gradle --no-daemon clean assembleDebug

      - name: Verify and stage RC15 APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/igp-build/IGP/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "package: name='com.infinitygreenpower.offerstudio.preview' versionCode='49' versionName='5.0.0-rc15-test'" /tmp/badging.txt
          cp "$APK" "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc15-Updated.apk"
          sha256sum "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc15-Updated.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc15-Updated-APK
          path: IGP-Organizer-Form-5.0.0-rc15-Updated.apk
          if-no-files-found: error
          retention-days: 7
