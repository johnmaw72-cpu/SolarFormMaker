name: Temporary RC24 Edit Unfinished Form on PDF Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-rc24:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact RC23 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lines = Path('.github/workflows/temp-rc23-build.yml').read_text().splitlines()
          for name in ['Reconstruct exact RC22 source','Apply RC23 new form choice and required field highlights']:
              start = next(i for i,l in enumerate(lines) if l.strip() == f'- name: {name}')
              run = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
              body=[]
              for line in lines[run+1:]:
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  body.append(line[10:] if line.startswith('          ') else line)
              p=Path('/tmp')/(name.replace(' ','_')+'.sh')
              p.write_text('\n'.join(body).rstrip()+'\n')
              subprocess.run(['bash',str(p)],check=True)
          PY
          grep -Fq 'versionCode = 57' /tmp/igp-build/IGP/app/build.gradle.kts
          grep -Fq 'versionName = "5.0.0-rc23"' /tmp/igp-build/IGP/app/build.gradle.kts

      - name: Apply RC24 edit on PDF patch
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/igp-build/IGP
          cat build-input/rc24_edit_on_pdf/part*.txt > /tmp/rc24.patch.gz.b64
          echo '11a744615665296093f40d7cb25aa49369704a18a73ee11c495013119eb9403d  /tmp/rc24.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/rc24.patch.gz.b64 > /tmp/rc24.patch.gz
          echo '3578f92ce3e4240e8caaa5d0daaaaf14216c5bff5d31452367df922a730d670f  /tmp/rc24.patch.gz' | sha256sum -c -
          gzip -dc /tmp/rc24.patch.gz > /tmp/rc24.patch
          echo '9c86d4b109234aa0064051bf0088295f3737e38efca28f3dccd4bf14dc2d8de5  /tmp/rc24.patch' | sha256sum -c -
          cd "$ROOT"
          patch -p1 < /tmp/rc24.patch
          grep -Fq 'versionCode = 58' app/build.gradle.kts
          grep -Fq 'versionName = "5.0.0-rc24"' app/build.gradle.kts
          grep -Fq 'Edit on PDF' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt
          grep -Fq 'Preview Final PDF' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt
          grep -Fq 'builderTitle = tr(lang, "Edit Form"' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Prepare compatible preview signing
        shell: bash
        run: |
          set -euo pipefail
          base64 -d build-input/v5_language_fix/preview-test-keystore.b64 > /tmp/igp-preview-test.jks
          RC16=.github/workflows/temp-rc16-build.yml
          echo "IGP_PREVIEW_KEYSTORE=/tmp/igp-preview-test.jks" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_STORE_PASSWORD=$(awk -F': ' '/IGP_PREVIEW_STORE_PASSWORD:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_KEY_ALIAS=$(awk -F': ' '/IGP_PREVIEW_KEY_ALIAS:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_KEY_PASSWORD=$(awk -F': ' '/IGP_PREVIEW_KEY_PASSWORD:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"

      - name: Build RC24 APK
        working-directory: /tmp/igp-build/IGP
        run: gradle --no-daemon clean assembleDebug

      - name: Verify and stage RC24 APK and source
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/igp-build/IGP/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "package: name='com.infinitygreenpower.offerstudio.preview' versionCode='58' versionName='5.0.0-rc24-test'" /tmp/badging.txt
          cp "$APK" "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc24-Edit-Unfinished-on-PDF.apk"
          cd /tmp/igp-build
          find IGP -type d \( -name build -o -name .gradle \) -prune -exec rm -rf {} + || true
          zip -qr "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc24-source.zip" IGP
          cd "$GITHUB_WORKSPACE"
          sha256sum IGP-Organizer-Form-5.0.0-rc24-Edit-Unfinished-on-PDF.apk IGP-Organizer-Form-5.0.0-rc24-source.zip

      - uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc24-APK-and-Source
          path: |
            IGP-Organizer-Form-5.0.0-rc24-Edit-Unfinished-on-PDF.apk
            IGP-Organizer-Form-5.0.0-rc24-source.zip
          if-no-files-found: error
          retention-days: 7
