name: Build IGP RC10 Diagnostic

on:
  push:
    branches: [chatgpt-v5-pdf-fix-build]
    paths: ['.github/workflows/build-v5-rc10-diagnostic.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Reconstruct RC10
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          cat build-input/v5_pdf_fix/source.b64.part* | base64 -d > /tmp/igp-source.zip
          rm -rf /tmp/igp-build && mkdir -p /tmp/igp-build
          unzip -q /tmp/igp-source.zip -d /tmp/igp-build || true
          SRC=/tmp/igp-build/IGP/app/src
          mkdir -p "$SRC/main"
          for DIR in java res assets; do [ -d "$SRC/$DIR" ] && cp -a "$SRC/$DIR" "$SRC/main/" || true; done
          [ -f "$SRC/AndroidManifest.xml" ] && cp "$SRC/AndroidManifest.xml" "$SRC/main/AndroidManifest.xml" || true
          cp build-input/v5_pdf_fix/Relations.kt "$SRC/main/java/com/infinitygreenpower/organizerform/data/db/Relations.kt"
          cat build-input/v5_language_fix/overlay.b64.part* | base64 -d > /tmp/rc3.tar.gz
          tar -xzf /tmp/rc3.tar.gz -C /tmp/igp-build/IGP
          cat build-input/v5_rc4_fix/overlay.b64.part* | base64 -d > /tmp/rc4.tar.gz
          tar -xzf /tmp/rc4.tar.gz -C /tmp/igp-build/IGP
          python - <<'PY'
          import base64,zlib
          from pathlib import Path
          repo=Path.cwd(); root=Path('/tmp/igp-build/IGP')
          mapping={
            repo/'build-input/v5_rc9_fix/FormScreen.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt',
            repo/'build-input/v5_rc8_fix/IGPOrganizerApp.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/app/IGPOrganizerApp.kt',
            repo/'build-input/v5_rc8_fix/SettingsScreen.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/feature/settings/SettingsScreen.kt',
            repo/'build-input/v5_rc8_fix/PdfExporter.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/export/pdf/PdfExporter.kt',
            repo/'build-input/v5_rc9_fix/CatalogScreen.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/feature/catalog/CatalogScreen.kt',
          }
          for s,d in mapping.items():
            d.parent.mkdir(parents=True,exist_ok=True)
            d.write_bytes(zlib.decompress(base64.b64decode(s.read_bytes())))
          dao=root/'app/src/main/java/com/infinitygreenpower/organizerform/data/db/Daos.kt'
          t=dao.read_text(); needle='@Insert(onConflict = OnConflictStrategy.IGNORE) suspend fun insertSeed(items: List<CatalogItemEntity>): List<Long>'
          if 'suspend fun upsert(item: CatalogItemEntity)' not in t:
            t=t.replace(needle,needle+'\n    @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun upsert(item: CatalogItemEntity)')
          dao.write_text(t)
          Path('/tmp/apply_rc10.py').write_bytes(zlib.decompress(base64.b64decode((repo/'build-input/v5_rc10_fix/apply_rc10.z9.b64').read_bytes())))
          PY
          python /tmp/apply_rc10.py /tmp/igp-build/IGP
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/igp-build/IGP/app/build.gradle.kts'); t=p.read_text()
          t=t.replace('versionCode = 38','versionCode = 44').replace('versionName = "5.0.0-rc4"','versionName = "5.0.0-rc10"')
          p.write_text(t)
          PY
          sed -i 's#<string name="app_name">IGP Organizer Form</string>#<string name="app_name">IGP Organizer Form Preview</string>#' "$SRC/main/res/values/strings.xml"
          sed -i 's#<string name="app_name">استمارة منظم IGP</string>#<string name="app_name">استمارة منظم IGP - تجريبي</string>#' "$SRC/main/res/values-ar/strings.xml"
          sed -i 's#<string name="app_name">فۆرمی ڕێکخەری IGP</string>#<string name="app_name">فۆرمی ڕێکخەری IGP - تاقیکردنەوە</string>#' "$SRC/main/res/values-b+ckb/strings.xml"
          cat build-input/v5_language_fix/preview-test-keystore.b64 | base64 -d > /tmp/igp-preview-test.jks

      - name: Build and capture
        shell: bash
        env:
          IGP_PREVIEW_KEYSTORE: /tmp/igp-preview-test.jks
          IGP_PREVIEW_STORE_PASSWORD: IGPPreview2026!
          IGP_PREVIEW_KEY_ALIAS: igp-preview
          IGP_PREVIEW_KEY_PASSWORD: IGPPreview2026!
        run: |
          set +e
          cd /tmp/igp-build/IGP
          gradle --no-daemon clean assembleDebug > /tmp/rc10.log 2>&1
          RC=$?
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          echo "gradle_exit=$RC" > "$GITHUB_WORKSPACE/build-output/rc10-build-status.txt"
          tail -n 180 /tmp/rc10.log >> "$GITHUB_WORKSPACE/build-output/rc10-build-status.txt"
          if [ "$RC" -eq 0 ]; then
            APK=app/build/outputs/apk/debug/app-debug.apk
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1 >> "$GITHUB_WORKSPACE/build-output/rc10-build-status.txt"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" >> "$GITHUB_WORKSPACE/build-output/rc10-build-status.txt" 2>&1
            cp "$APK" "$GITHUB_WORKSPACE/build-output/IGP-Organizer-Form-5.0.0-rc10-Notes-Approx-Catalog.apk"
            sha256sum "$GITHUB_WORKSPACE/build-output/IGP-Organizer-Form-5.0.0-rc10-Notes-Approx-Catalog.apk" >> "$GITHUB_WORKSPACE/build-output/rc10-build-status.txt"
          fi
          exit 0

      - name: Publish result
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin chatgpt-v5-pdf-fix-build
          git rebase origin/chatgpt-v5-pdf-fix-build || true
          git add build-output/rc10-build-status.txt
          [ -f build-output/IGP-Organizer-Form-5.0.0-rc10-Notes-Approx-Catalog.apk ] && git add build-output/IGP-Organizer-Form-5.0.0-rc10-Notes-Approx-Catalog.apk || true
          git commit -m "Publish RC10 diagnostic build" || exit 0
          git pull --rebase origin chatgpt-v5-pdf-fix-build || true
          git push origin HEAD:chatgpt-v5-pdf-fix-build
