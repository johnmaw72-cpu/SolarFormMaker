name: Build IGP RC10

on:
  push:
    branches:
      - chatgpt-v5-pdf-fix-build
    paths:
      - '.github/workflows/build-v5-rc10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Publish run id
        shell: bash
        run: |
          mkdir -p build-output
          echo "${GITHUB_RUN_ID}" > build-output/rc10-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/rc10-run-id.txt
          git commit -m "Publish RC10 run id" || true
          git push || true

      - name: Reconstruct and patch RC10 source
        shell: bash
        run: |
          set -euo pipefail
          cat build-input/v5_pdf_fix/source.b64.part* | base64 -d > /tmp/igp-source.zip
          rm -rf /tmp/igp-build && mkdir -p /tmp/igp-build
          unzip -q /tmp/igp-source.zip -d /tmp/igp-build || true
          SRC=/tmp/igp-build/IGP/app/src
          mkdir -p "$SRC/main"
          for DIR in java res assets; do [ -d "$SRC/$DIR" ] && cp -a "$SRC/$DIR" "$SRC/main/" || true; done
          [ -f "$SRC/AndroidManifest.xml" ] && cp "$SRC/AndroidManifest.xml" "$SRC/main/AndroidManifest.xml" || true
          cp build-input/v5_pdf_fix/Relations.kt "$SRC/main/java/com/infinitygreenpower/organizerform/data/db/Relations.kt"

          cat build-input/v5_language_fix/overlay.b64.part* | base64 -d > /tmp/rc3-overlay.tar.gz
          tar -xzf /tmp/rc3-overlay.tar.gz -C /tmp/igp-build/IGP
          cat build-input/v5_rc4_fix/overlay.b64.part* | base64 -d > /tmp/rc4-overlay.tar.gz
          tar -xzf /tmp/rc4-overlay.tar.gz -C /tmp/igp-build/IGP

          python - <<'PY'
          import base64,zlib
          from pathlib import Path
          repo=Path.cwd(); root=Path('/tmp/igp-build/IGP')
          mapping={
            repo/'build-input/v5_rc9_fix/FormScreen.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt',
            repo/'build-input/v5_rc8_fix/IGPOrganizerApp.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/app/IGPOrganizerApp.kt',
            repo/'build-input/v5_rc8_fix/SettingsScreen.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/feature/settings/SettingsScreen.kt',
            repo/'build-input/v5_rc8_fix/PdfExporter.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/export/pdf/PdfExporter.kt',
            repo/'build-input/v5_rc9_fix/CatalogScreen.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/feature/catalog/CatalogScreen.kt',
          }
          for src,dst in mapping.items():
            dst.parent.mkdir(parents=True,exist_ok=True)
            dst.write_bytes(zlib.decompress(base64.b64decode(src.read_bytes())))
          dao=root/'app/src/main/java/com/infinitygreenpower/organizerform/data/db/Daos.kt'
          t=dao.read_text()
          needle='@Insert(onConflict = OnConflictStrategy.IGNORE) suspend fun insertSeed(items: List<CatalogItemEntity>): List<Long>'
          if 'suspend fun upsert(item: CatalogItemEntity)' not in t:
              t=t.replace(needle, needle+'\n    @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun upsert(item: CatalogItemEntity)')
          dao.write_text(t)
          patch=zlib.decompress(base64.b64decode((repo/'build-input/v5_rc10_fix/apply_rc10.z9.b64').read_bytes()))
          Path('/tmp/apply_rc10.py').write_bytes(patch)
          PY
          python /tmp/apply_rc10.py /tmp/igp-build/IGP

          python - <<'PY'
          from pathlib import Path
          build=Path('/tmp/igp-build/IGP/app/build.gradle.kts')
          t=build.read_text().replace('versionCode = 38','versionCode = 44').replace('versionName = "5.0.0-rc4"','versionName = "5.0.0-rc10"')
          build.write_text(t)
          PY

          sed -i 's#<string name="app_name">IGP Organizer Form</string>#<string name="app_name">IGP Organizer Form Preview</string>#' "$SRC/main/res/values/strings.xml"
          sed -i 's#<string name="app_name">استمارة منظم IGP</string>#<string name="app_name">استمارة منظم IGP - تجريبي</string>#' "$SRC/main/res/values-ar/strings.xml"
          sed -i 's#<string name="app_name">فۆرمی ڕێکخەری IGP</string>#<string name="app_name">فۆرمی ڕێکخەری IGP - تاقیکردنەوە</string>#' "$SRC/main/res/values-b+ckb/strings.xml"
          cat build-input/v5_language_fix/preview-test-keystore.b64 | base64 -d > /tmp/igp-preview-test.jks

          grep -Fq 'versionCode = 44' /tmp/igp-build/IGP/app/build.gradle.kts
          grep -Fq 'versionName = "5.0.0-rc10"' /tmp/igp-build/IGP/app/build.gradle.kts
          grep -Fq 'لا یشمل مواد واعمال AC' "$SRC/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt"
          grep -Fq 'isApproximate' "$SRC/main/java/com/infinitygreenpower/organizerform/feature/form/FormModels.kt"
          grep -Fq 'MIGRATION_2_3' "$SRC/main/java/com/infinitygreenpower/organizerform/data/db/OrganizerDatabase.kt"
          grep -Fq 'selected = isSelected' "$SRC/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt"
          grep -Fq 'suspend fun upsert(item: CatalogItemEntity)' "$SRC/main/java/com/infinitygreenpower/organizerform/data/db/Daos.kt"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build RC10 APK
        working-directory: /tmp/igp-build/IGP
        env:
          IGP_PREVIEW_KEYSTORE: /tmp/igp-preview-test.jks
          IGP_PREVIEW_STORE_PASSWORD: IGPPreview2026!
          IGP_PREVIEW_KEY_ALIAS: igp-preview
          IGP_PREVIEW_KEY_PASSWORD: IGPPreview2026!
        run: gradle --no-daemon clean assembleDebug

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/igp-build/IGP/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          BADGING=$("$AAPT" dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep "name='com.infinitygreenpower.offerstudio.preview'"
          echo "$BADGING" | grep "versionCode='44'"
          echo "$BADGING" | grep "versionName='5.0.0-rc10-test'"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/signing.txt
          grep -qi '1f83a683d692d6530df5ba8e4ba1892e18bb11a313c5f744b464f3bf003c06f0' /tmp/signing.txt
          unzip -t "$APK" >/dev/null
          cp "$APK" IGP-Organizer-Form-5.0.0-rc10-Notes-Approx-Catalog.apk
          (cd /tmp/igp-build && zip -qr "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc10-source.zip" IGP)
          sha256sum IGP-Organizer-Form-5.0.0-rc10-Notes-Approx-Catalog.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc10-Download
          path: |
            IGP-Organizer-Form-5.0.0-rc10-Notes-Approx-Catalog.apk
            IGP-Organizer-Form-5.0.0-rc10-source.zip
          retention-days: 7
