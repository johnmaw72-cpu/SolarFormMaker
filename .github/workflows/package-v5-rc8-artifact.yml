name: Package IGP RC8 APK Artifact

on:
  push:
    branches:
      - chatgpt-v5-pdf-fix-build
    paths:
      - '.github/workflows/package-v5-rc8-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify RC8 APK exists
        run: test -s build-output/IGP-Organizer-Form-5.0.0-rc8-Saved-Language-PDF-Spacing-Fix.apk
      - name: Upload RC8 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc8-Download
          path: build-output/IGP-Organizer-Form-5.0.0-rc8-Saved-Language-PDF-Spacing-Fix.apk
          retention-days: 7
          if-no-files-found: error
      - name: Publish run id
        shell: bash
        run: |
          echo "${{ github.run_id }}" > build-output/rc8-artifact-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/rc8-artifact-run-id.txt
          git commit -m "Publish RC8 artifact run id" || exit 0
          git push
