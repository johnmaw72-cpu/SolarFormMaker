name: Temporary RC23 New Form Choice and Required Highlights Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-rc23:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact RC22 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lines = Path('.github/workflows/temp-rc22-build.yml').read_text().splitlines()
          for name in ['Reconstruct exact RC21 source','Apply RC22 draft resume and clean builder patch']:
              start = next(i for i,l in enumerate(lines) if l.strip() == f'- name: {name}')
              run = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
              body=[]
              for line in lines[run+1:]:
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  body.append(line[10:] if line.startswith('          ') else line)
              p=Path('/tmp')/(name.replace(' ','_')+'.sh')
              p.write_text('\n'.join(body).rstrip()+'\n')
              subprocess.run(['bash',str(p)],check=True)
          PY
          grep -Fq 'versionCode = 56' /tmp/igp-build/IGP/app/build.gradle.kts
          grep -Fq 'versionName = "5.0.0-rc22"' /tmp/igp-build/IGP/app/build.gradle.kts

      - name: Apply RC23 new form choice and required field highlights
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/igp-build/IGP
          cat build-input/rc23_new_form_choice/part*.txt > /tmp/rc23.patch.gz.b64
          echo 'ae7898f8f1c5e1dc745a261d1ec1dca7d876e9c70110ddc6f4903bba21dcacb9  /tmp/rc23.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/rc23.patch.gz.b64 > /tmp/rc23.patch.gz
          echo 'd387268adde97d0f7dbc7879d3e809fd41a7703fcb79ae2ba22de7e50659b4c0  /tmp/rc23.patch.gz' | sha256sum -c -
          gzip -dc /tmp/rc23.patch.gz > /tmp/rc23.patch
          echo 'd8a2841ae5b9fa334bc92947bbeb7a53d114d066cc52d9315302c4726590f4e2  /tmp/rc23.patch' | sha256sum -c -
          cd "$ROOT"
          patch -p2 < /tmp/rc23.patch
          grep -Fq 'versionCode = 57' app/build.gradle.kts
          grep -Fq 'versionName = "5.0.0-rc23"' app/build.gradle.kts
          grep -Fq 'Unfinished draft found' app/src/main/java/com/infinitygreenpower/organizerform/app/IGPOrganizerApp.kt
          grep -Fq 'Continue Draft' app/src/main/java/com/infinitygreenpower/organizerform/app/IGPOrganizerApp.kt
          grep -Fq 'Start New Form' app/src/main/java/com/infinitygreenpower/organizerform/app/IGPOrganizerApp.kt
          grep -Fq 'RequiredEditorNotice' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt
          grep -Fq 'Required — fill this field' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Prepare compatible preview signing
        shell: bash
        run: |
          set -euo pipefail
          base64 -d build-input/v5_language_fix/preview-test-keystore.b64 > /tmp/igp-preview-test.jks
          RC16=.github/workflows/temp-rc16-build.yml
          echo "IGP_PREVIEW_KEYSTORE=/tmp/igp-preview-test.jks" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_STORE_PASSWORD=$(awk -F': ' '/IGP_PREVIEW_STORE_PASSWORD:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_KEY_ALIAS=$(awk -F': ' '/IGP_PREVIEW_KEY_ALIAS:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_KEY_PASSWORD=$(awk -F': ' '/IGP_PREVIEW_KEY_PASSWORD:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"

      - name: Build RC23 APK
        working-directory: /tmp/igp-build/IGP
        run: gradle --no-daemon clean assembleDebug

      - name: Verify and stage RC23 APK and source
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/igp-build/IGP/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "package: name='com.infinitygreenpower.offerstudio.preview' versionCode='57' versionName='5.0.0-rc23-test'" /tmp/badging.txt
          cp "$APK" "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc23-New-Form-Choice-Required-Highlights.apk"
          cd /tmp/igp-build
          find IGP -type d \( -name build -o -name .gradle \) -prune -exec rm -rf {} + || true
          zip -qr "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc23-source.zip" IGP
          cd "$GITHUB_WORKSPACE"
          sha256sum IGP-Organizer-Form-5.0.0-rc23-New-Form-Choice-Required-Highlights.apk IGP-Organizer-Form-5.0.0-rc23-source.zip

      - uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc23-APK-and-Source
          path: |
            IGP-Organizer-Form-5.0.0-rc23-New-Form-Choice-Required-Highlights.apk
            IGP-Organizer-Form-5.0.0-rc23-source.zip
          if-no-files-found: error
          retention-days: 7
