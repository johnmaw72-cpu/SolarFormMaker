name: Temporary RC12 APK Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RC11 source and RC12 patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin chatgpt-v5-pdf-fix-build --depth=1
          git show origin/chatgpt-v5-pdf-fix-build:build-output/IGP-Organizer-Form-5.0.0-rc11-source.zip > /tmp/rc11-source.zip
          git show origin/chatgpt-v5-pdf-fix-build:build-input/rc12_patch.py > /tmp/rc12_patch.py
          git show origin/chatgpt-v5-pdf-fix-build:build-input/v5_language_fix/preview-test-keystore.b64 > /tmp/preview-key.b64
          rm -rf /tmp/igp-build && mkdir -p /tmp/igp-build
          unzip -q /tmp/rc11-source.zip -d /tmp/igp-build
          python /tmp/rc12_patch.py
          base64 -d /tmp/preview-key.b64 > /tmp/igp-preview-test.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build RC12 APK
        working-directory: /tmp/igp-build/IGP
        env:
          IGP_PREVIEW_KEYSTORE: /tmp/igp-preview-test.jks
          IGP_PREVIEW_STORE_PASSWORD: IGPPreview2026!
          IGP_PREVIEW_KEY_ALIAS: igp-preview
          IGP_PREVIEW_KEY_PASSWORD: IGPPreview2026!
        run: gradle --no-daemon clean assembleDebug

      - name: Verify RC12 APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/igp-build/IGP/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          BADGING=$("$AAPT" dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep "name='com.infinitygreenpower.offerstudio.preview'"
          echo "$BADGING" | grep "versionCode='46'"
          echo "$BADGING" | grep "versionName='5.0.0-rc12-test'"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/signing.txt
          grep -qi '1f83a683d692d6530df5ba8e4ba1892e18bb11a313c5f744b464f3bf003c06f0' /tmp/signing.txt
          unzip -t "$APK" >/dev/null
          cp "$APK" IGP-Organizer-Form-5.0.0-rc12-Insets-Keyboard-PDF-Note-Column.apk
          sha256sum IGP-Organizer-Form-5.0.0-rc12-Insets-Keyboard-PDF-Note-Column.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc12-APK
          path: IGP-Organizer-Form-5.0.0-rc12-Insets-Keyboard-PDF-Note-Column.apk
          retention-days: 7
