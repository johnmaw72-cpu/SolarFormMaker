name: RC32 Structured Prepared Notes

on:
  push:
    branches: [chatgpt-rc32-prepared-notes-20260930]

permissions:
  contents: read

jobs:
  build-rc32:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact RC31 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lines = Path('.github/workflows/temp-rc31-build.yml').read_text().splitlines()
          for name in ['Reconstruct exact RC30 source','Apply RC31 notes UI patch']:
              start = next(i for i,l in enumerate(lines) if l.strip() == f'- name: {name}')
              run = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
              body=[]
              for line in lines[run+1:]:
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  body.append(line[10:] if line.startswith('          ') else line)
              p=Path('/tmp')/(name.replace(' ','_')+'.sh')
              p.write_text('\n'.join(body).rstrip()+'\n')
              subprocess.run(['bash',str(p)],check=True)
          PY
          grep -Fq 'versionCode = 65' /tmp/igp-build/IGP/app/build.gradle.kts
          grep -Fq 'versionName = "5.0.0-rc31"' /tmp/igp-build/IGP/app/build.gradle.kts

      - name: Apply RC32 structured prepared notes patch
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/igp-build/IGP
          cat build-input/rc32_prepared_notes/part*.txt > /tmp/rc32.patch.gz.b64
          echo 'b382915720716269ebe454ebee966e5e8be8a27601cfab4b48ce29fe0e67d93f  /tmp/rc32.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/rc32.patch.gz.b64 > /tmp/rc32.patch.gz
          echo 'fa4975efa7140b0ca0cf9ce7159ffc9f4e04ddc0105205d7ebf93f6a597d9582  /tmp/rc32.patch.gz' | sha256sum -c -
          gzip -dc /tmp/rc32.patch.gz > /tmp/rc32.patch
          echo '0ea1a02f6993b43d7ea001ccb43cfb49546099c5dacd56e68a5dc6397b4172ef  /tmp/rc32.patch' | sha256sum -c -
          cd "$ROOT"
          git apply /tmp/rc32.patch
          grep -Fq 'versionCode = 66' app/build.gradle.kts
          grep -Fq 'versionName = "5.0.0-rc32"' app/build.gradle.kts
          grep -Fq 'Prepared Note 1 — Production / Saving' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt
          grep -Fq 'Prepared Note 2 — Electricity Production / Saving' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt
          grep -Fq 'Prepared Note 3 — Seasonal Production' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt
          grep -Fq 'Prepared Note 4 — AC / Civil-work Exclusions' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt
          ! grep -Fq 'Write an additional note' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt
          grep -Fq 'renderPreparedNotes' app/src/main/java/com/infinitygreenpower/organizerform/export/pdf/PdfExporter.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Generate complete Gradle wrapper
        working-directory: /tmp/igp-build/IGP
        run: gradle wrapper --gradle-version 9.4.1

      - name: Prepare compatible preview signing
        shell: bash
        run: |
          set -euo pipefail
          base64 -d build-input/v5_language_fix/preview-test-keystore.b64 > /tmp/igp-preview-test.jks
          RC16=.github/workflows/temp-rc16-build.yml
          echo "IGP_PREVIEW_KEYSTORE=/tmp/igp-preview-test.jks" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_STORE_PASSWORD=$(awk -F': ' '/IGP_PREVIEW_STORE_PASSWORD:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_KEY_ALIAS=$(awk -F': ' '/IGP_PREVIEW_KEY_ALIAS:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_KEY_PASSWORD=$(awk -F': ' '/IGP_PREVIEW_KEY_PASSWORD:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"

      - name: Build RC32 APK
        working-directory: /tmp/igp-build/IGP
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verify and stage RC32 APK and source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/igp-build/IGP
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "package: name='com.infinitygreenpower.offerstudio.preview' versionCode='66' versionName='5.0.0-rc32-test'" /tmp/badging.txt
          test -s "$ROOT/gradle/wrapper/gradle-wrapper.jar"
          grep -Fq 'gradle-9.4.1-bin.zip' "$ROOT/gradle/wrapper/gradle-wrapper.properties"
          cp "$APK" "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc32-Prepared-Notes.apk"
          cd /tmp/igp-build
          find IGP -type d \( -name build -o -name .gradle \) -prune -exec rm -rf {} + || true
          zip -qr "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc32-source.zip" IGP

      - uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc32-Prepared-Notes-APK-and-Source
          path: |
            IGP-Organizer-Form-5.0.0-rc32-Prepared-Notes.apk
            IGP-Organizer-Form-5.0.0-rc32-source.zip
          if-no-files-found: error
          retention-days: 7
