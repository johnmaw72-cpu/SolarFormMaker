name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact stable v4.8.0 source
        uses: actions/checkout@v4
        with:
          ref: 53d9482a665067a0bc64027b78dc34e9abfa86a0
          fetch-depth: 1

      - name: Apply v4.8.4 regression-safe patch
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA":app/src/main/java/com/infinitygreenpower/solarform/OfferStudioV484Activity.java \
            > app/src/main/java/com/infinitygreenpower/solarform/OfferStudioV484Activity.java
          git show "$GITHUB_SHA":app/src/main/res/drawable/ic_igp_organizer_v482.xml \
            > app/src/main/res/drawable/ic_igp_organizer_v482.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('.OfferStudioV480Activity','.OfferStudioV484Activity')
          s=s.replace('@drawable/ic_offer_studio','@drawable/ic_igp_organizer_v482')
          p.write_text(s)
          p=Path('app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 34', s)
          s=re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '4.8.4'", s)
          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent signing key
        run: base64 -d signing/solarform-debug.keystore.b64 > signing/solarform-debug.keystore

      - name: Build signed debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk IGP-Organizer-Form-v4.8.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-v4.8.4-APK
          path: IGP-Organizer-Form-v4.8.4.apk
          if-no-files-found: error
          retention-days: 30
