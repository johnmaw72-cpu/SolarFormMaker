name: Build IGP RC7 PDF Field Spacing Fix

on:
  push:
    branches:
      - chatgpt-v5-pdf-fix-build
    paths:
      - '.github/workflows/build-v5-rc7-pdf-field-spacing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct RC6 and apply RC7 field-spacing fix
        shell: bash
        run: |
          set -euo pipefail
          cat build-input/v5_pdf_fix/source.b64.part* | base64 -d > /tmp/igp-source.zip
          mkdir -p /tmp/igp-build
          unzip -q /tmp/igp-source.zip -d /tmp/igp-build || true
          SRC=/tmp/igp-build/IGP/app/src
          mkdir -p "$SRC/main"
          for DIR in java res assets; do
            if [ -d "$SRC/$DIR" ]; then cp -a "$SRC/$DIR" "$SRC/main/"; fi
          done
          if [ -f "$SRC/AndroidManifest.xml" ]; then cp "$SRC/AndroidManifest.xml" "$SRC/main/AndroidManifest.xml"; fi
          cp build-input/v5_pdf_fix/Relations.kt "$SRC/main/java/com/infinitygreenpower/organizerform/data/db/Relations.kt"

          cat build-input/v5_language_fix/overlay.b64.part* | base64 -d > /tmp/rc3-overlay.tar.gz
          test "$(sha256sum /tmp/rc3-overlay.tar.gz | awk '{print $1}')" = "34e246853dc4d297e6f1c4ee3c4f8446ee16966f5188105b856ed1cb0af5711e"
          tar -xzf /tmp/rc3-overlay.tar.gz -C /tmp/igp-build/IGP

          cat build-input/v5_rc4_fix/overlay.b64.part* | base64 -d > /tmp/rc4-overlay.tar.gz
          test "$(sha256sum /tmp/rc4-overlay.tar.gz | awk '{print $1}')" = "5c2d81ba10375c24b595a6f138e1f6906959d9922e1c5e5e74e71fd8253eef0d"
          tar -xzf /tmp/rc4-overlay.tar.gz -C /tmp/igp-build/IGP

          python - <<'PY2'
          import base64, zlib
          from pathlib import Path

          repo = Path.cwd()
          root = Path('/tmp/igp-build/IGP')
          mapping = {
              repo/'build-input/v5_rc6_fix/FormScreen.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt',
              repo/'build-input/v5_rc6_fix/SettingsScreen.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/feature/settings/SettingsScreen.kt',
              repo/'build-input/v5_rc6_fix/PdfExporter.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/export/pdf/PdfExporter.kt',
          }
          for src, dst in mapping.items():
              data = zlib.decompress(base64.b64decode(src.read_bytes()))
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(data)

          build = root/'app/build.gradle.kts'
          text = build.read_text()
          assert 'versionCode = 38' in text
          assert 'versionName = "5.0.0-rc4"' in text
          text = text.replace('versionCode = 38', 'versionCode = 41')
          text = text.replace('versionName = "5.0.0-rc4"', 'versionName = "5.0.0-rc7"')
          build.write_text(text)

          pdf = root/'app/src/main/java/com/infinitygreenpower/organizerform/export/pdf/PdfExporter.kt'
          s = pdf.read_text()
          old = '''        fun pair(label: String, value: String) {
            val labelWidth = 132
            val gap = 8
            val valueWidth = contentWidth - labelWidth - gap
            val labelHeight = measure(label, labelWidth, 9, true, Layout.Alignment.ALIGN_NORMAL)
            val valueHeight = measure(value, valueWidth, 9, false, Layout.Alignment.ALIGN_NORMAL)
            val h = maxOf(23, maxOf(labelHeight, valueHeight) + 9)
            ensure(h)

            val top = y + 4
            if (rtl) {
                // RTL rows read naturally from the right: label first, then its value immediately to the left.
                drawCell(
                    label,
                    (right - labelWidth).toFloat(),
                    top,
                    labelWidth,
                    9,
                    true,
                    muted,
                    Layout.Alignment.ALIGN_NORMAL
                )
                drawCell(
                    value,
                    left.toFloat(),
                    top,
                    valueWidth,
                    9,
                    false,
                    navy,
                    Layout.Alignment.ALIGN_NORMAL
                )
            } else {
                drawCell(
                    label,
                    left.toFloat(),
                    top,
                    labelWidth,
                    9,
                    true,
                    muted,
                    Layout.Alignment.ALIGN_NORMAL
                )
                drawCell(
                    value,
                    (left + labelWidth + gap).toFloat(),
                    top,
                    valueWidth,
                    9,
                    false,
                    navy,
                    Layout.Alignment.ALIGN_NORMAL
                )
            }

            paint.color = border
            canvas!!.drawLine(left.toFloat(), (y + h - 2).toFloat(), right.toFloat(), (y + h - 2).toFloat(), paint)
            y += h
        }
'''
          new = '''        fun pair(label: String, value: String) {
            val labelWidth = 132
            val gap = 8
            val maxValueWidth = contentWidth - labelWidth - gap
            val labelHeight = measure(label, labelWidth, 9, true, Layout.Alignment.ALIGN_NORMAL)

            // In RTL rows the value may start with Latin text or numbers (for example "erbil",
            // a phone number, a date, or an organizer name). FIRSTSTRONG then treats that value
            // as LTR, so drawing it inside the old full-width value cell pushed it all the way to
            // the left edge of the page. Use a content-sized value cell anchored beside the label
            // instead. Long values still get a generous wrapping width.
            val valueCellWidth = if (rtl) compactValueWidth(value, maxValueWidth) else maxValueWidth
            val valueHeight = measure(value, valueCellWidth, 9, false, Layout.Alignment.ALIGN_NORMAL)
            val h = maxOf(23, maxOf(labelHeight, valueHeight) + 9)
            ensure(h)

            val top = y + 4
            if (rtl) {
                val valueRight = right - labelWidth - gap
                drawCell(
                    label,
                    (right - labelWidth).toFloat(),
                    top,
                    labelWidth,
                    9,
                    true,
                    muted,
                    Layout.Alignment.ALIGN_NORMAL
                )
                drawCell(
                    value,
                    (valueRight - valueCellWidth).toFloat(),
                    top,
                    valueCellWidth,
                    9,
                    false,
                    navy,
                    Layout.Alignment.ALIGN_NORMAL
                )
            } else {
                drawCell(
                    label,
                    left.toFloat(),
                    top,
                    labelWidth,
                    9,
                    true,
                    muted,
                    Layout.Alignment.ALIGN_NORMAL
                )
                drawCell(
                    value,
                    (left + labelWidth + gap).toFloat(),
                    top,
                    maxValueWidth,
                    9,
                    false,
                    navy,
                    Layout.Alignment.ALIGN_NORMAL
                )
            }

            paint.color = border
            canvas!!.drawLine(left.toFloat(), (y + h - 2).toFloat(), right.toFloat(), (y + h - 2).toFloat(), paint)
            y += h
        }

        private fun compactValueWidth(value: String, maxWidth: Int): Int {
            textPaint.textSize = 9f
            textPaint.typeface = Typeface.create("sans-serif", Typeface.NORMAL)
            val measured = kotlin.math.ceil(textPaint.measureText(value.trim()).toDouble()).toInt() + 8
            // Keep short values visually close to their labels, while leaving enough room for
            // readable wrapping of long client/location/organizer text.
            return measured.coerceIn(48, minOf(maxWidth, 260))
        }
'''
          if old not in s:
              raise SystemExit('RC6 pair() block not found; refusing to build an unverified patch')
          s = s.replace(old, new)
          pdf.write_text(s)
          PY2

          sed -i 's#<string name="app_name">IGP Organizer Form</string>#<string name="app_name">IGP Organizer Form Preview</string>#' "$SRC/main/res/values/strings.xml"
          sed -i 's#<string name="app_name">استمارة منظم IGP</string>#<string name="app_name">استمارة منظم IGP - تجريبي</string>#' "$SRC/main/res/values-ar/strings.xml"
          sed -i 's#<string name="app_name">فۆرمی ڕێکخەری IGP</string>#<string name="app_name">فۆرمی ڕێکخەری IGP - تاقیکردنەوە</string>#' "$SRC/main/res/values-b+ckb/strings.xml"

          cat build-input/v5_language_fix/preview-test-keystore.b64 | base64 -d > /tmp/igp-preview-test.jks

          BUILD=/tmp/igp-build/IGP/app/build.gradle.kts
          PDF="$SRC/main/java/com/infinitygreenpower/organizerform/export/pdf/PdfExporter.kt"
          test "$(sha256sum "$PDF" | awk '{print $1}')" = "a8725b5475b785f2da1643c3ebfe15d6d59a0f8aecb45fd9bf1fd5e50cafd0ac"
          grep -Fq 'versionCode = 41' "$BUILD"
          grep -Fq 'versionName = "5.0.0-rc7"' "$BUILD"
          grep -Fq 'applicationIdSuffix = ".preview"' "$BUILD"
          grep -Fq 'compactValueWidth' "$PDF"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build RC7 preview APK
        working-directory: /tmp/igp-build/IGP
        shell: bash
        env:
          IGP_PREVIEW_KEYSTORE: /tmp/igp-preview-test.jks
          IGP_PREVIEW_STORE_PASSWORD: IGPPreview2026!
          IGP_PREVIEW_KEY_ALIAS: igp-preview
          IGP_PREVIEW_KEY_PASSWORD: IGPPreview2026!
        run: gradle --no-daemon clean assembleDebug

      - name: Verify update identity and APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/igp-build/IGP/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK" && test -x "$AAPT" && test -x "$APKSIGNER"
          BADGING=$("$AAPT" dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep "name='com.infinitygreenpower.offerstudio.preview'"
          echo "$BADGING" | grep "versionCode='41'"
          echo "$BADGING" | grep "versionName='5.0.0-rc7-test'"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/signing.txt
          grep -qi '1f83a683d692d6530df5ba8e4ba1892e18bb11a313c5f744b464f3bf003c06f0' /tmp/signing.txt
          unzip -t "$APK" >/dev/null
          cp "$APK" IGP-Organizer-Form-5.0.0-rc7-PDF-Field-Spacing-Fix.apk
          sha256sum IGP-Organizer-Form-5.0.0-rc7-PDF-Field-Spacing-Fix.apk

      - name: Package updated source
        shell: bash
        run: |
          cd /tmp/igp-build/IGP
          zip -qr "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc7-PDF-Field-Spacing-Fix-source.zip" .

      - name: Upload APK and source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc7-PDF-Field-Spacing-Fix
          path: |
            IGP-Organizer-Form-5.0.0-rc7-PDF-Field-Spacing-Fix.apk
            IGP-Organizer-Form-5.0.0-rc7-PDF-Field-Spacing-Fix-source.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to build branch
        shell: bash
        run: |
          mkdir -p build-output
          cp IGP-Organizer-Form-5.0.0-rc7-PDF-Field-Spacing-Fix.apk build-output/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/IGP-Organizer-Form-5.0.0-rc7-PDF-Field-Spacing-Fix.apk
          git commit -m "Build v5.0.0-rc7 PDF field spacing fix APK" || exit 0
          git push
