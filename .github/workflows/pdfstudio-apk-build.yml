name: Build PDF Studio Pro APK

on:
  push:
    branches:
      - pdfstudio-apk-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore PDF Studio Pro 1.0.0-rc1 source
        shell: bash
        run: |
          cat pdfstudio-buildparts/p*.b64 | base64 --decode > "$RUNNER_TEMP/pdfstudio.tar.zst"
          echo "dbbfd8ea64c19f6f2375057bcd13e9abe81264bad7a638cd502246259794a1ef  $RUNNER_TEMP/pdfstudio.tar.zst" | sha256sum --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          mkdir -p "$RUNNER_TEMP/pdfstudio-src"
          zstd -d -q "$RUNNER_TEMP/pdfstudio.tar.zst" -o "$RUNNER_TEMP/pdfstudio.tar"
          tar -xf "$RUNNER_TEMP/pdfstudio.tar" -C "$RUNNER_TEMP/pdfstudio-src"
          if [ -d pdfstudio-patches ]; then
            cp -R pdfstudio-patches/. "$RUNNER_TEMP/pdfstudio-src/"
          fi
          test -f "$RUNNER_TEMP/pdfstudio-src/settings.gradle.kts"
          test -f "$RUNNER_TEMP/pdfstudio-src/app/build.gradle.kts"

      - name: Build installable debug APK
        id: compile
        shell: bash
        working-directory: ${{ runner.temp }}/pdfstudio-src
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          tail -n 300 "$RUNNER_TEMP/build.log"
          exit $status

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Prepare APK artifact
        if: success()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/apk-out"
          cp "$RUNNER_TEMP/pdfstudio-src/app/build/outputs/apk/debug/app-debug.apk" \
             "$RUNNER_TEMP/apk-out/PDF-Studio-Pro-1.0.0-rc1-Test.apk"
          sha256sum "$RUNNER_TEMP/apk-out/PDF-Studio-Pro-1.0.0-rc1-Test.apk" | tee "$RUNNER_TEMP/apk-out/SHA256.txt"
          ls -lh "$RUNNER_TEMP/apk-out/PDF-Studio-Pro-1.0.0-rc1-Test.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Pro-1.0.0-rc1-APK
          path: |
            ${{ runner.temp }}/apk-out/PDF-Studio-Pro-1.0.0-rc1-Test.apk
            ${{ runner.temp }}/apk-out/SHA256.txt
          if-no-files-found: error
          retention-days: 7
