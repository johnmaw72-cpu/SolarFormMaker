name: Temporary RC20 Single Form Builder Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-rc20:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact RC19 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lines = Path('.github/workflows/temp-rc19-build.yml').read_text().splitlines()
          for name in ['Reconstruct exact RC18 source','Apply RC19 per-form notes language']:
              start = next(i for i,l in enumerate(lines) if l.strip() == f'- name: {name}')
              run = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
              body=[]
              for line in lines[run+1:]:
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  body.append(line[10:] if line.startswith('          ') else line)
              p=Path('/tmp')/(name.replace(' ','_')+'.sh')
              p.write_text('\n'.join(body).rstrip()+'\n')
              subprocess.run(['bash',str(p)],check=True)
          PY
          grep -Fq 'versionCode = 53' /tmp/igp-build/IGP/app/build.gradle.kts
          grep -Fq 'versionName = "5.0.0-rc19"' /tmp/igp-build/IGP/app/build.gradle.kts

      - name: Apply RC20 single-form builder patch
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/igp-build/IGP
          cat build-input/rc20_single_form/part*.txt > /tmp/rc20.patch.gz.b64
          base64 -d /tmp/rc20.patch.gz.b64 > /tmp/rc20.patch.gz
          echo '640c162d1edd3384a8c5dd433ad9c3375bf05ea4844d7a7a33ddd115bdf82410  /tmp/rc20.patch.gz' | sha256sum -c -
          gzip -dc /tmp/rc20.patch.gz > /tmp/rc20.patch
          echo '9fddf31a89a4caf27065ae7ec0965257bbbdecfbe5df74b5e50cea421bce6eeb  /tmp/rc20.patch' | sha256sum -c -
          cd "$ROOT"
          patch -p2 < /tmp/rc20.patch
          grep -Fq 'versionCode = 54' app/build.gradle.kts
          grep -Fq 'versionName = "5.0.0-rc20"' app/build.gradle.kts
          grep -Fq 'val directBuilderMode = formId == null' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt
          grep -Fq 'builderMode: Boolean = false' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt
          grep -Fq 'Fill the form using the edit / + buttons directly on the PDF.' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt
          grep -Fq 'mutableState.value = aggregate.toUi(activeCurrency).copy(step = 5)' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormViewModel.kt
          grep -Fq '<string name="new_support">Open the prepared form and fill it directly</string>' app/src/res/values/strings.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Prepare RC19-compatible preview signing
        shell: bash
        run: |
          set -euo pipefail
          base64 -d build-input/v5_language_fix/preview-test-keystore.b64 > /tmp/igp-preview-test.jks
          RC16=.github/workflows/temp-rc16-build.yml
          echo "IGP_PREVIEW_KEYSTORE=/tmp/igp-preview-test.jks" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_STORE_PASSWORD=$(awk -F': ' '/IGP_PREVIEW_STORE_PASSWORD:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_KEY_ALIAS=$(awk -F': ' '/IGP_PREVIEW_KEY_ALIAS:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_KEY_PASSWORD=$(awk -F': ' '/IGP_PREVIEW_KEY_PASSWORD:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"

      - name: Build RC20 APK
        working-directory: /tmp/igp-build/IGP
        run: gradle --no-daemon clean assembleDebug

      - name: Verify and stage RC20 APK and source
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/igp-build/IGP/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "package: name='com.infinitygreenpower.offerstudio.preview' versionCode='54' versionName='5.0.0-rc20-test'" /tmp/badging.txt
          cp "$APK" "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc20-Single-Form-Builder.apk"
          cd /tmp/igp-build
          find IGP -type d \( -name build -o -name .gradle \) -prune -exec rm -rf {} + || true
          zip -qr "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc20-source.zip" IGP
          cd "$GITHUB_WORKSPACE"
          sha256sum IGP-Organizer-Form-5.0.0-rc20-Single-Form-Builder.apk IGP-Organizer-Form-5.0.0-rc20-source.zip

      - uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc20-APK-and-Source
          path: |
            IGP-Organizer-Form-5.0.0-rc20-Single-Form-Builder.apk
            IGP-Organizer-Form-5.0.0-rc20-source.zip
          if-no-files-found: error
          retention-days: 7
