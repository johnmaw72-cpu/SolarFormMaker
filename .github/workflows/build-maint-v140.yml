name: Build IGP Maintenance v1.4.0 APK

on:
  push:
    branches: [ maintenance-build-v140 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct maintenance source
        run: |
          rm -f /tmp/maintenance-v140.zip
          for f in ci/v140.part00 ci/v140.part01 ci/v140.part02 ci/v140.part03 ci/v140.part04 ci/v140.part05 ci/v140.part06 ci/v140.part07 ci/v140.part08 ci/v140.part09 ci/v140.part10; do
            echo "Decoding $f"
            tr -d '\r\n ' < "$f" | base64 -d >> /tmp/maintenance-v140.zip
          done
          echo "Reconstructed source ZIP:"
          ls -lh /tmp/maintenance-v140.zip
          sha256sum /tmp/maintenance-v140.zip
          unzip -t /tmp/maintenance-v140.zip
          rm -rf maintenance-v140
          mkdir -p maintenance-v140
          unzip -q /tmp/maintenance-v140.zip -d maintenance-v140
          test -f maintenance-v140/settings.gradle.kts
          test -f maintenance-v140/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          cp ci/igp-maint-debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build debug APK
        working-directory: maintenance-v140
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -f maintenance-v140/app/build/outputs/apk/debug/app-debug.apk
          cp maintenance-v140/app/build/outputs/apk/debug/app-debug.apk IGP-Technical-Maintenance-Reports-v1.4.0-Debug.apk
          sha256sum IGP-Technical-Maintenance-Reports-v1.4.0-Debug.apk > IGP-Technical-Maintenance-Reports-v1.4.0-Debug.apk.sha256
          ls -lh IGP-Technical-Maintenance-Reports-v1.4.0-Debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IGP-Technical-Maintenance-Reports-v1.4.0-APK
          path: |
            IGP-Technical-Maintenance-Reports-v1.4.0-Debug.apk
            IGP-Technical-Maintenance-Reports-v1.4.0-Debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
