name: Build IGP Maintenance v1.4.1 APK

on:
  push:
    branches: [ maintenance-build-v140 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct verified maintenance source
        run: |
          set -euo pipefail
          rm -f /tmp/v140.b64 /tmp/maintenance-v140.zip
          cat ci/v140.part00 ci/v140.part01 ci/v140.part02 ci/v140.part03 ci/v140.part04 > /tmp/v140.b64
          cat ci/v140.fix05.p00 ci/v140.fix05.p01 ci/v140.fix05.p02 ci/v140.fix05.p03 ci/v140.fix05.p04 \
            | base64 -d | gzip -d >> /tmp/v140.b64
          cat ci/v140.part06 >> /tmp/v140.b64
          cat ci/v140.fix07.p00 ci/v140.fix07.p01 ci/v140.fix07.p02 ci/v140.fix07.p03 ci/v140.fix07.p04 \
            | base64 -d | gzip -d >> /tmp/v140.b64
          cat ci/v140.part08 ci/v140.part09 >> /tmp/v140.b64
          cat ci/v140.part10.xz.b64 | base64 -d | xz -d >> /tmp/v140.b64
          test "$(wc -c < /tmp/v140.b64)" -eq 186544
          base64 -d /tmp/v140.b64 > /tmp/maintenance-v140.zip
          echo 'a15b25d629089727e3e00da5d9304da989fc379c5df37ab1d85778fa6bb1294b  /tmp/maintenance-v140.zip' | sha256sum -c -
          unzip -t /tmp/maintenance-v140.zip
          rm -rf maintenance-v140
          mkdir -p maintenance-v140
          unzip -q /tmp/maintenance-v140.zip -d maintenance-v140
          test -f maintenance-v140/settings.gradle.kts
          test -f maintenance-v140/app/build.gradle.kts

      - name: Apply v1.4.1 source fixes
        run: |
          python3 - <<'PY2'
          from pathlib import Path

          p = Path('maintenance-v140/app/src/main/java/com/infinitygreen/maintenance/rebuild/ui/viewmodel/AppViewModels.kt')
          s = p.read_text()
          imp = 'import com.infinitygreen.maintenance.rebuild.domain.DraftPart\n'
          if imp not in s:
              anchor = 'import com.infinitygreen.maintenance.rebuild.domain.Currency\n'
              if anchor not in s:
                  raise SystemExit('Currency import anchor not found')
              s = s.replace(anchor, anchor + imp)
              p.write_text(s)

          p = Path('maintenance-v140/app/src/main/java/com/infinitygreen/maintenance/rebuild/data/files/PdfExporter.kt')
          s = p.read_text()
          old = '''        ) {
              val top = y
              val headerHeight = if (companyLogo != null || appLogo != null) 72f else 55f
              companyLogo?.let { drawBitmapFit(it, RectF(margin, top, margin + 116f, top + 54f)) }
              appLogo?.let { drawBitmapFit(it, RectF(width - margin - 54f, top, width - margin, top + 54f)) }
              val titleLines = title.split('\\n')
              val startBaseline = top + if (titleLines.size > 1) 20f else 28f
              titleLines.forEachIndexed { index, line ->
                  canvas.drawText(line, width / 2f, startBaseline + index * 18f, titlePaint)
              }
              canvas.drawText(subtitle, width / 2f, startBaseline + titleLines.size * 18f + 1f, subtitlePaint)
              if (companyLogo == null && appLogo == null) {
                  val companyPaint = Paint(label).apply { color = green; textAlign = Paint.Align.CENTER }
                  canvas.drawText(companyName, width / 2f, top + headerHeight - 5f, companyPaint)
              }
              y = top + headerHeight
          }
'''
          new = '''        ) {
              val top = y
              val hasAnyLogo = companyLogo != null || appLogo != null
              val headerHeight = 76f

              companyLogo?.let { drawBitmapFit(it, RectF(margin, top, margin + 116f, top + 54f)) }
              appLogo?.let { drawBitmapFit(it, RectF(width - margin - 54f, top, width - margin, top + 54f)) }

              val titleLines = title.split('\\n')
              val titleLineSpacing = 18f
              val startBaseline = top + if (titleLines.size > 1) 20f else 27f
              titleLines.forEachIndexed { index, line ->
                  canvas.drawText(line, width / 2f, startBaseline + index * titleLineSpacing, titlePaint)
              }

              val subtitleBaseline = startBaseline + titleLines.size * titleLineSpacing + 1f
              canvas.drawText(subtitle, width / 2f, subtitleBaseline, subtitlePaint)

              if (!hasAnyLogo) {
                  val companyPaint = Paint(label).apply {
                      color = green
                      textAlign = Paint.Align.CENTER
                  }
                  val companyBaseline = maxOf(subtitleBaseline + 12f, top + headerHeight - 6f)
                  canvas.drawText(companyName, width / 2f, companyBaseline.coerceAtMost(top + headerHeight - 5f), companyPaint)
              }

              y = top + headerHeight
          }
'''
          if old not in s:
              raise SystemExit('PDF header source block not found')
          p.write_text(s.replace(old, new))

          p = Path('maintenance-v140/app/build.gradle.kts')
          s = p.read_text().replace('versionCode = 10400', 'versionCode = 10401').replace('versionName = "1.4.0"', 'versionName = "1.4.1"')
          p.write_text(s)
          PY2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          cp ci/igp-maint-debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build debug APK
        working-directory: maintenance-v140
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -f maintenance-v140/app/build/outputs/apk/debug/app-debug.apk
          cp maintenance-v140/app/build/outputs/apk/debug/app-debug.apk IGP-Technical-Maintenance-Reports-v1.4.1-Debug.apk
          sha256sum IGP-Technical-Maintenance-Reports-v1.4.1-Debug.apk > IGP-Technical-Maintenance-Reports-v1.4.1-Debug.apk.sha256
          ls -lh IGP-Technical-Maintenance-Reports-v1.4.1-Debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IGP-Technical-Maintenance-Reports-v1.4.1-APK
          path: |
            IGP-Technical-Maintenance-Reports-v1.4.1-Debug.apk
            IGP-Technical-Maintenance-Reports-v1.4.1-Debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
