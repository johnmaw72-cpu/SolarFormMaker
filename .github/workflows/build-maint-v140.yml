name: Build IGP Maintenance v1.4.2 APK

on:
  push:
    branches: [ maintenance-build-v140 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct verified maintenance source
        run: |
          set -euo pipefail
          rm -f /tmp/v140.b64 /tmp/maintenance-v140.zip
          cat ci/v140.part00 ci/v140.part01 ci/v140.part02 ci/v140.part03 ci/v140.part04 > /tmp/v140.b64
          cat ci/v140.fix05.p00 ci/v140.fix05.p01 ci/v140.fix05.p02 ci/v140.fix05.p03 ci/v140.fix05.p04 | base64 -d | gzip -d >> /tmp/v140.b64
          cat ci/v140.part06 >> /tmp/v140.b64
          cat ci/v140.fix07.p00 ci/v140.fix07.p01 ci/v140.fix07.p02 ci/v140.fix07.p03 ci/v140.fix07.p04 | base64 -d | gzip -d >> /tmp/v140.b64
          cat ci/v140.part08 ci/v140.part09 >> /tmp/v140.b64
          cat ci/v140.part10.xz.b64 | base64 -d | xz -d >> /tmp/v140.b64
          test "$(wc -c < /tmp/v140.b64)" -eq 186544
          base64 -d /tmp/v140.b64 > /tmp/maintenance-v140.zip
          echo 'a15b25d629089727e3e00da5d9304da989fc379c5df37ab1d85778fa6bb1294b  /tmp/maintenance-v140.zip' | sha256sum -c -
          rm -rf maintenance-v140
          mkdir -p maintenance-v140
          unzip -q /tmp/maintenance-v140.zip -d maintenance-v140
          test -f maintenance-v140/settings.gradle.kts
          test -f maintenance-v140/app/build.gradle.kts

      - name: Apply v1.4.1 patch
        run: patch -p0 < ci/v141.patch

      - name: Apply v1.4.2 spare-parts patch
        run: |
          echo '' | base64 -d | gzip -d | patch -p0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          cp ci/igp-maint-debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build debug APK
        working-directory: maintenance-v140
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -f maintenance-v140/app/build/outputs/apk/debug/app-debug.apk
          cp maintenance-v140/app/build/outputs/apk/debug/app-debug.apk IGP-Technical-Maintenance-Reports-v1.4.2-Debug.apk
          sha256sum IGP-Technical-Maintenance-Reports-v1.4.2-Debug.apk > IGP-Technical-Maintenance-Reports-v1.4.2-Debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IGP-Technical-Maintenance-Reports-v1.4.2-APK
          path: |
            IGP-Technical-Maintenance-Reports-v1.4.2-Debug.apk
            IGP-Technical-Maintenance-Reports-v1.4.2-Debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
