name: RC33 Real PDF Notes Text
on:
  push:
    branches: [chatgpt-rc33-real-pdf-notes-20260930]
permissions:
  contents: read
jobs:
  build-rc33:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact RC32 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/temp-rc32-build.yml').read_text().splitlines()
          for name in ['Reconstruct exact RC31 source','Apply RC32 structured prepared notes patch']:
              start=next(i for i,l in enumerate(lines) if l.strip()==f'- name: {name}')
              run=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='run: |')
              body=[]
              for line in lines[run+1:]:
                  if line.startswith('      - name:') or line.startswith('      - uses:'): break
                  body.append(line[10:] if line.startswith('          ') else line)
              p=Path('/tmp')/(name.replace(' ','_')+'.sh')
              p.write_text('\n'.join(body).rstrip()+'\n')
              subprocess.run(['bash',str(p)],check=True)
          PY
      - name: Apply RC33 real PDF notes patch
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/igp-build/IGP
          cat build-input/rc33_real_pdf_notes/part*.txt > /tmp/rc33.patch.gz.b64
          echo 'be4becef550b7b26fe963fac15855e3369fd35fb9e018f44be905680873b4258  /tmp/rc33.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/rc33.patch.gz.b64 > /tmp/rc33.patch.gz
          echo '14b55b399d183c98eea69cb4fece963a4b8b3c0f3e2288e8cba2f2a22862ed04  /tmp/rc33.patch.gz' | sha256sum -c -
          gzip -dc /tmp/rc33.patch.gz > /tmp/rc33.patch
          echo '049b00ffc2fabb4051a85b4b1abbdbaecd7127f359115c5bb976da92caba12cc  /tmp/rc33.patch' | sha256sum -c -
          cd "$ROOT"
          git apply /tmp/rc33.patch
          cat > RC33_UPDATES.md <<'EOF'
          # RC33 — Real PDF Notes Text
          Notes are emitted as visible PDF text objects with RTL shaping and ActualText.
          EOF
          grep -Fq 'versionCode = 67' app/build.gradle.kts
          grep -Fq 'versionName = "5.0.0-rc33"' app/build.gradle.kts
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: ''}
      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}
      - name: Generate Gradle wrapper
        working-directory: /tmp/igp-build/IGP
        run: gradle wrapper --gradle-version 9.4.1
      - name: Prepare preview signing
        shell: bash
        run: |
          base64 -d build-input/v5_language_fix/preview-test-keystore.b64 > /tmp/igp-preview-test.jks
          RC16=.github/workflows/temp-rc16-build.yml
          echo "IGP_PREVIEW_KEYSTORE=/tmp/igp-preview-test.jks" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_STORE_PASSWORD=$(awk -F': ' '/IGP_PREVIEW_STORE_PASSWORD:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_KEY_ALIAS=$(awk -F': ' '/IGP_PREVIEW_KEY_ALIAS:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_KEY_PASSWORD=$(awk -F': ' '/IGP_PREVIEW_KEY_PASSWORD:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"
      - name: Build RC33 APK
        working-directory: /tmp/igp-build/IGP
        run: ./gradlew --no-daemon clean assembleDebug
      - name: Stage RC33 APK and source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/igp-build/IGP
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "package: name='com.infinitygreenpower.offerstudio.preview' versionCode='67' versionName='5.0.0-rc33-test'" /tmp/badging.txt
          cp "$APK" "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc33-Real-PDF-Notes.apk"
          cd /tmp/igp-build
          find IGP -type d \( -name build -o -name .gradle \) -prune -exec rm -rf {} + || true
          zip -qr "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc33-source.zip" IGP
      - uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc33-Real-PDF-Notes-APK-and-Source
          path: |
            IGP-Organizer-Form-5.0.0-rc33-Real-PDF-Notes.apk
            IGP-Organizer-Form-5.0.0-rc33-source.zip
          if-no-files-found: error
          retention-days: 7
