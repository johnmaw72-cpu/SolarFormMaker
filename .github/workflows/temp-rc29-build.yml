name: RC29 Prepared Form Runtime Fix

on:
  push:
    branches: [chatgpt-rc29-prepared-form-fix-20260901]

permissions:
  contents: read

jobs:
  build-rc29:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact RC27 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lines = Path('.github/workflows/temp-rc27-build.yml').read_text().splitlines()
          for name in ['Reconstruct exact RC25 source','Apply RC27 logical Unicode notes patch']:
              start = next(i for i,l in enumerate(lines) if l.strip() == f'- name: {name}')
              run = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
              body=[]
              for line in lines[run+1:]:
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  body.append(line[10:] if line.startswith('          ') else line)
              p=Path('/tmp')/(name.replace(' ','_')+'.sh')
              p.write_text('\n'.join(body).rstrip()+'\n')
              subprocess.run(['bash',str(p)],check=True)
          PY

      - name: Apply RC28 controlled inputs patch
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/igp-build/IGP
          cat build-input/rc28_controlled_inputs/part*.txt > /tmp/rc28.patch.gz.b64
          base64 -d /tmp/rc28.patch.gz.b64 > /tmp/rc28.patch.gz
          echo '2e35072cd5e4c9c766be58d49068fdeff4bb70cc7610f2f3323e4531e2699cae  /tmp/rc28.patch.gz' | sha256sum -c -
          gzip -dc /tmp/rc28.patch.gz > /tmp/rc28.patch
          echo 'a8ab9e104645c0b759fb12306f2ddeaaedb9624d63be20a93b538402abbd147a  /tmp/rc28.patch' | sha256sum -c -
          cd "$ROOT"
          git apply /tmp/rc28.patch
          grep -Fq 'versionCode = 62' app/build.gradle.kts
          grep -Fq 'versionName = "5.0.0-rc28"' app/build.gradle.kts

      - name: Apply RC29 prepared form fix
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/igp-build/IGP
          cat build-input/rc29_prepared_form_fix/part*.txt > /tmp/rc29.patch.gz.b64
          echo '77e4949cfa2ebab7e56b0c46f4ec009dcbbcc3ae40dfbb3c67a2a8fae7d6b53f  /tmp/rc29.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/rc29.patch.gz.b64 > /tmp/rc29.patch.gz
          echo '6cb3d301779b8c874e111eabf91282c24ca18c017f25d3d4c48ff0068f3295e1  /tmp/rc29.patch.gz' | sha256sum -c -
          gzip -dc /tmp/rc29.patch.gz > /tmp/rc29.patch
          echo 'df3dec823a782c3e480b2f2c986574794bc7f9fe30cadd6e3745d2f3807d367a  /tmp/rc29.patch' | sha256sum -c -
          cd "$ROOT"
          git apply /tmp/rc29.patch
          grep -Fq 'versionCode = 63' app/build.gradle.kts
          grep -Fq 'versionName = "5.0.0-rc29"' app/build.gradle.kts
          grep -Fq 'rawPdf.copyTo(file, overwrite = true)' app/src/main/java/com/infinitygreenpower/organizerform/export/pdf/PdfExporter.kt
          grep -Fq 'candidateSystemFonts' app/src/main/java/com/infinitygreenpower/organizerform/export/pdf/UnicodeNoteTextLayer.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Generate complete Gradle wrapper
        working-directory: /tmp/igp-build/IGP
        run: gradle wrapper --gradle-version 9.4.1

      - name: Prepare compatible preview signing
        shell: bash
        run: |
          set -euo pipefail
          base64 -d build-input/v5_language_fix/preview-test-keystore.b64 > /tmp/igp-preview-test.jks
          RC16=.github/workflows/temp-rc16-build.yml
          echo "IGP_PREVIEW_KEYSTORE=/tmp/igp-preview-test.jks" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_STORE_PASSWORD=$(awk -F': ' '/IGP_PREVIEW_STORE_PASSWORD:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_KEY_ALIAS=$(awk -F': ' '/IGP_PREVIEW_KEY_ALIAS:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_KEY_PASSWORD=$(awk -F': ' '/IGP_PREVIEW_KEY_PASSWORD:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"

      - name: Build RC29 APK
        working-directory: /tmp/igp-build/IGP
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verify and stage RC29 APK and source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/igp-build/IGP
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "package: name='com.infinitygreenpower.offerstudio.preview' versionCode='63' versionName='5.0.0-rc29-test'" /tmp/badging.txt
          test -s "$ROOT/gradle/wrapper/gradle-wrapper.jar"
          grep -Fq 'gradle-9.4.1-bin.zip' "$ROOT/gradle/wrapper/gradle-wrapper.properties"
          cp "$APK" "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc29-Prepared-Form-Fix.apk"
          cd /tmp/igp-build
          find IGP -type d \( -name build -o -name .gradle \) -prune -exec rm -rf {} + || true
          zip -qr "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc29-source.zip" IGP

      - uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc29-Prepared-Form-Fix-APK-and-Source
          path: |
            IGP-Organizer-Form-5.0.0-rc29-Prepared-Form-Fix.apk
            IGP-Organizer-Form-5.0.0-rc29-source.zip
          if-no-files-found: error
          retention-days: 7
