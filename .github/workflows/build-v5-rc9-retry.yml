name: Build IGP RC9 Retry

on:
  push:
    branches:
      - chatgpt-rc9-catalog-build
    paths:
      - '.github/workflows/build-v5-rc9-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Publish run id
        shell: bash
        run: |
          mkdir -p build-output
          echo "${GITHUB_RUN_ID}" > build-output/rc9-retry-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/rc9-retry-run-id.txt
          git commit -m "Publish RC9 retry run id" || true
          git push || true

      - name: Reconstruct RC9 source
        shell: bash
        run: |
          set -euo pipefail
          cat build-input/v5_pdf_fix/source.b64.part* | base64 -d > /tmp/igp-source.zip
          rm -rf /tmp/igp-build
          mkdir -p /tmp/igp-build
          unzip -q /tmp/igp-source.zip -d /tmp/igp-build || true
          SRC=/tmp/igp-build/IGP/app/src
          mkdir -p "$SRC/main"
          for DIR in java res assets; do [ -d "$SRC/$DIR" ] && cp -a "$SRC/$DIR" "$SRC/main/" || true; done
          [ -f "$SRC/AndroidManifest.xml" ] && cp "$SRC/AndroidManifest.xml" "$SRC/main/AndroidManifest.xml" || true
          cp build-input/v5_pdf_fix/Relations.kt "$SRC/main/java/com/infinitygreenpower/organizerform/data/db/Relations.kt"
          cat build-input/v5_language_fix/overlay.b64.part* | base64 -d > /tmp/rc3-overlay.tar.gz
          tar -xzf /tmp/rc3-overlay.tar.gz -C /tmp/igp-build/IGP
          cat build-input/v5_rc4_fix/overlay.b64.part* | base64 -d > /tmp/rc4-overlay.tar.gz
          tar -xzf /tmp/rc4-overlay.tar.gz -C /tmp/igp-build/IGP

          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          repo = Path.cwd()
          root = Path('/tmp/igp-build/IGP')
          mapping = {
              repo/'build-input/v5_rc6_fix/FormScreen.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt',
              repo/'build-input/v5_rc8_fix/IGPOrganizerApp.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/app/IGPOrganizerApp.kt',
              repo/'build-input/v5_rc8_fix/SettingsScreen.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/feature/settings/SettingsScreen.kt',
              repo/'build-input/v5_rc8_fix/PdfExporter.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/export/pdf/PdfExporter.kt',
              repo/'build-input/v5_rc9_fix/CatalogScreen.z9.b64': root/'app/src/main/java/com/infinitygreenpower/organizerform/feature/catalog/CatalogScreen.kt',
          }
          for src, dst in mapping.items():
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(zlib.decompress(base64.b64decode(src.read_bytes())))

          form = root/'app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt'
          text = form.read_text()
          start = text.index('@Composable private fun Segment(')
          end = text.index('@Composable private fun Summary', start)
          replacement = '''@Composable private fun Segment(values:List<String>,selected:String,labelFor:(String)->String={it},onSelect:(String)->Unit){CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr){SingleChoiceSegmentedButtonRow(Modifier.fillMaxWidth()){values.forEachIndexed{i,v->val isSelected=selected==v;SegmentedButton(selected=isSelected,onClick={onSelect(v)},shape=SegmentedButtonDefaults.itemShape(i,values.size),modifier=Modifier.weight(1f).heightIn(min=62.dp),icon={}){Column(horizontalAlignment=Alignment.CenterHorizontally,verticalArrangement=Arrangement.Center){Text(labelFor(v),fontSize=10.5.sp,lineHeight=13.sp,maxLines=2,textAlign=TextAlign.Center,modifier=Modifier.fillMaxWidth());Text(if(isSelected) "✓" else " ",fontSize=14.sp,lineHeight=14.sp,textAlign=TextAlign.Center,modifier=Modifier.fillMaxWidth().height(16.dp))}}}}}

'''
          form.write_text(text[:start] + replacement + text[end:])

          dao = root/'app/src/main/java/com/infinitygreenpower/organizerform/data/db/Daos.kt'
          text = dao.read_text()
          needle = '@Insert(onConflict = OnConflictStrategy.IGNORE) suspend fun insertSeed(items: List<CatalogItemEntity>): List<Long>'
          if 'suspend fun upsert(item: CatalogItemEntity)' not in text:
              text = text.replace(needle, needle + '\n    @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun upsert(item: CatalogItemEntity)')
          dao.write_text(text)

          build = root/'app/build.gradle.kts'
          text = build.read_text()
          text = text.replace('versionCode = 38', 'versionCode = 43')
          text = text.replace('versionName = "5.0.0-rc4"', 'versionName = "5.0.0-rc9"')
          build.write_text(text)
          PY

          sed -i 's#<string name="app_name">IGP Organizer Form</string>#<string name="app_name">IGP Organizer Form Preview</string>#' "$SRC/main/res/values/strings.xml"
          sed -i 's#<string name="app_name">استمارة منظم IGP</string>#<string name="app_name">استمارة منظم IGP - تجريبي</string>#' "$SRC/main/res/values-ar/strings.xml"
          sed -i 's#<string name="app_name">فۆرمی ڕێکخەری IGP</string>#<string name="app_name">فۆرمی ڕێکخەری IGP - تاقیکردنەوە</string>#' "$SRC/main/res/values-b+ckb/strings.xml"
          cat build-input/v5_language_fix/preview-test-keystore.b64 | base64 -d > /tmp/igp-preview-test.jks

          grep -Fq 'icon={}' "$SRC/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt"
          grep -Fq 'if(isSelected) "✓" else " "' "$SRC/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt"
          grep -Fq 'Add Catalog Item' "$SRC/main/java/com/infinitygreenpower/organizerform/feature/catalog/CatalogScreen.kt"
          grep -Fq 'Edit Catalog Item' "$SRC/main/java/com/infinitygreenpower/organizerform/feature/catalog/CatalogScreen.kt"
          grep -Fq 'restoreState = destination != Destination.Saved' "$SRC/main/java/com/infinitygreenpower/organizerform/app/IGPOrganizerApp.kt"
          grep -Fq 'versionCode = 43' /tmp/igp-build/IGP/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build RC9 APK
        working-directory: /tmp/igp-build/IGP
        env:
          IGP_PREVIEW_KEYSTORE: /tmp/igp-preview-test.jks
          IGP_PREVIEW_STORE_PASSWORD: IGPPreview2026!
          IGP_PREVIEW_KEY_ALIAS: igp-preview
          IGP_PREVIEW_KEY_PASSWORD: IGPPreview2026!
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/igp-build/IGP/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          BADGING=$("$AAPT" dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep "name='com.infinitygreenpower.offerstudio.preview'"
          echo "$BADGING" | grep "versionCode='43'"
          echo "$BADGING" | grep "versionName='5.0.0-rc9-test'"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/signing.txt
          grep -qi '1f83a683d692d6530df5ba8e4ba1892e18bb11a313c5f744b464f3bf003c06f0' /tmp/signing.txt
          unzip -t "$APK" >/dev/null
          cp "$APK" IGP-Organizer-Form-5.0.0-rc9-Catalog-Controls-Fix.apk
          sha256sum IGP-Organizer-Form-5.0.0-rc9-Catalog-Controls-Fix.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc9-Retry-APK
          path: IGP-Organizer-Form-5.0.0-rc9-Catalog-Controls-Fix.apk
          retention-days: 7
