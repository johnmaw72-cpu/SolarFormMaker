name: Build IGP RC4 Language + PDF Preview APK

on:
  push:
    branches:
      - chatgpt-v5-pdf-fix-build
    paths:
      - '.github/workflows/build-v5-pdf-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct RC4 source
        shell: bash
        run: |
          cat build-input/v5_pdf_fix/source.b64.part* | base64 -d > /tmp/igp-source.zip
          mkdir -p /tmp/igp-build
          unzip -q /tmp/igp-source.zip -d /tmp/igp-build || true
          SRC=/tmp/igp-build/IGP/app/src
          mkdir -p "$SRC/main"
          for DIR in java res assets; do
            if [ -d "$SRC/$DIR" ]; then cp -a "$SRC/$DIR" "$SRC/main/"; fi
          done
          if [ -f "$SRC/AndroidManifest.xml" ]; then cp "$SRC/AndroidManifest.xml" "$SRC/main/AndroidManifest.xml"; fi
          cp build-input/v5_pdf_fix/Relations.kt "$SRC/main/java/com/infinitygreenpower/organizerform/data/db/Relations.kt"

          # RC3 localization/PDF fixes.
          cat build-input/v5_language_fix/overlay.b64.part* | base64 -d > /tmp/rc3-overlay.tar.gz
          test "$(sha256sum /tmp/rc3-overlay.tar.gz | awk '{print $1}')" = "34e246853dc4d297e6f1c4ee3c4f8446ee16966f5188105b856ed1cb0af5711e"
          tar -xzf /tmp/rc3-overlay.tar.gz -C /tmp/igp-build/IGP

          # RC4: no Activity recreation on language change + in-app PDF preview + stable update track.
          cat build-input/v5_rc4_fix/overlay.b64.part* | base64 -d > /tmp/rc4-overlay.tar.gz
          test "$(sha256sum /tmp/rc4-overlay.tar.gz | awk '{print $1}')" = "5c2d81ba10375c24b595a6f138e1f6906959d9922e1c5e5e74e71fd8253eef0d"
          tar -xzf /tmp/rc4-overlay.tar.gz -C /tmp/igp-build/IGP

          sed -i 's#<string name="app_name">IGP Organizer Form</string>#<string name="app_name">IGP Organizer Form Preview</string>#' "$SRC/main/res/values/strings.xml"
          sed -i 's#<string name="app_name">استمارة منظم IGP</string>#<string name="app_name">استمارة منظم IGP - تجريبي</string>#' "$SRC/main/res/values-ar/strings.xml"
          sed -i 's#<string name="app_name">فۆرمی ڕێکخەری IGP</string>#<string name="app_name">فۆرمی ڕێکخەری IGP - تاقیکردنەوە</string>#' "$SRC/main/res/values-b+ckb/strings.xml"

          cat build-input/v5_language_fix/preview-test-keystore.b64 | base64 -d > /tmp/igp-preview-test.jks

          BUILD=/tmp/igp-build/IGP/app/build.gradle.kts
          APP="$SRC/main/java/com/infinitygreenpower/organizerform/app/IGPOrganizerApp.kt"
          LOCALE="$SRC/main/java/com/infinitygreenpower/organizerform/core/localization/LocalizedText.kt"
          SETTINGS="$SRC/main/java/com/infinitygreenpower/organizerform/feature/settings/SettingsScreen.kt"
          FORM="$SRC/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt"
          PDF="$SRC/main/java/com/infinitygreenpower/organizerform/export/pdf/PdfExporter.kt"

          test "$(sha256sum "$BUILD" | awk '{print $1}')" = "f60e09dcc1db699b21e9ec45eb9c2fe4df18b97a7ffd77b6e9426a1a4f7ff95b"
          test "$(sha256sum "$APP" | awk '{print $1}')" = "c82ee80c3048a28db0e44d7842d3f3cf42147d5b1a083cd7051f8e1fbb379e93"
          test "$(sha256sum "$LOCALE" | awk '{print $1}')" = "033c867a2863326ec46753ef6bd798a74d1936a99669a98ae79ca071b584ba8e"
          test "$(sha256sum "$SETTINGS" | awk '{print $1}')" = "c34041a09a4302ce8f9abc7bd6e921025a563732313cd1fda09b549f78585fa3"
          test "$(sha256sum "$FORM" | awk '{print $1}')" = "c81599db28a0e7ba70272dffce8ee61d3b5b173ffbac1f045733098f12ef7a22"
          test "$(sha256sum "$PDF" | awk '{print $1}')" = "d29e568f5adafe9f7d1efca82ffb39560d6370974d66d1e791ea75a83533d2c9"

          grep -q 'versionCode = 38' "$BUILD"
          grep -q 'versionName = "5.0.0-rc4"' "$BUILD"
          grep -q 'applicationIdSuffix = ".preview"' "$BUILD"
          grep -q 'Preview PDF' "$FORM"
          grep -q 'PdfRenderer' "$FORM"
          ! grep -R -q 'setApplicationLocales\|AppCompatDelegate.setApplicationLocales' "$SRC/main/java"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build RC4 preview APK
        working-directory: /tmp/igp-build/IGP
        shell: bash
        env:
          IGP_PREVIEW_KEYSTORE: /tmp/igp-preview-test.jks
          IGP_PREVIEW_STORE_PASSWORD: IGPPreview2026!
          IGP_PREVIEW_KEY_ALIAS: igp-preview
          IGP_PREVIEW_KEY_PASSWORD: IGPPreview2026!
        run: gradle --no-daemon clean assembleDebug

      - name: Verify update identity and APK
        shell: bash
        run: |
          APK=/tmp/igp-build/IGP/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK" && test -x "$AAPT" && test -x "$APKSIGNER"
          BADGING=$("$AAPT" dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep "name='com.infinitygreenpower.offerstudio.preview'"
          echo "$BADGING" | grep "versionCode='38'"
          echo "$BADGING" | grep "versionName='5.0.0-rc4-test'"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/signing.txt
          grep -qi '1f83a683d692d6530df5ba8e4ba1892e18bb11a313c5f744b464f3bf003c06f0' /tmp/signing.txt
          unzip -t "$APK" >/dev/null
          cp "$APK" IGP-Organizer-Form-5.0.0-rc4-Seamless-Language-PDF-Preview.apk
          sha256sum IGP-Organizer-Form-5.0.0-rc4-Seamless-Language-PDF-Preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc4-Seamless-Language-PDF-Preview-APK
          path: IGP-Organizer-Form-5.0.0-rc4-Seamless-Language-PDF-Preview.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to build branch
        shell: bash
        run: |
          mkdir -p build-output
          cp IGP-Organizer-Form-5.0.0-rc4-Seamless-Language-PDF-Preview.apk build-output/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/IGP-Organizer-Form-5.0.0-rc4-Seamless-Language-PDF-Preview.apk
          git commit -m "Build v5.0.0-rc4 seamless language and PDF preview APK" || exit 0
          git push
