name: Build IGP RC5 RTL Control Fix APK

on:
  push:
    branches:
      - chatgpt-v5-pdf-fix-build
    paths:
      - '.github/workflows/build-v5-pdf-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct RC5 source
        shell: bash
        run: |
          cat build-input/v5_pdf_fix/source.b64.part* | base64 -d > /tmp/igp-source.zip
          mkdir -p /tmp/igp-build
          unzip -q /tmp/igp-source.zip -d /tmp/igp-build || true
          SRC=/tmp/igp-build/IGP/app/src
          mkdir -p "$SRC/main"
          for DIR in java res assets; do
            if [ -d "$SRC/$DIR" ]; then cp -a "$SRC/$DIR" "$SRC/main/"; fi
          done
          if [ -f "$SRC/AndroidManifest.xml" ]; then cp "$SRC/AndroidManifest.xml" "$SRC/main/AndroidManifest.xml"; fi
          cp build-input/v5_pdf_fix/Relations.kt "$SRC/main/java/com/infinitygreenpower/organizerform/data/db/Relations.kt"

          cat build-input/v5_language_fix/overlay.b64.part* | base64 -d > /tmp/rc3-overlay.tar.gz
          test "$(sha256sum /tmp/rc3-overlay.tar.gz | awk '{print $1}')" = "34e246853dc4d297e6f1c4ee3c4f8446ee16966f5188105b856ed1cb0af5711e"
          tar -xzf /tmp/rc3-overlay.tar.gz -C /tmp/igp-build/IGP

          cat build-input/v5_rc4_fix/overlay.b64.part* | base64 -d > /tmp/rc4-overlay.tar.gz
          test "$(sha256sum /tmp/rc4-overlay.tar.gz | awk '{print $1}')" = "5c2d81ba10375c24b595a6f138e1f6906959d9922e1c5e5e74e71fd8253eef0d"
          tar -xzf /tmp/rc4-overlay.tar.gz -C /tmp/igp-build/IGP

          python - <<'PY'
          from pathlib import Path
          root = Path('/tmp/igp-build/IGP')

          build = root/'app/build.gradle.kts'
          s = build.read_text()
          assert 'versionCode = 38' in s and 'versionName = "5.0.0-rc4"' in s
          s = s.replace('versionCode = 38', 'versionCode = 39')
          s = s.replace('versionName = "5.0.0-rc4"', 'versionName = "5.0.0-rc5"')
          build.write_text(s)

          form = root/'app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt'
          s = form.read_text()
          if 'import androidx.compose.ui.platform.LocalLayoutDirection' not in s:
              s = s.replace('import androidx.compose.ui.platform.LocalContext\n', 'import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.platform.LocalLayoutDirection\n')
          if 'import androidx.compose.ui.text.style.TextAlign' not in s:
              s = s.replace('import androidx.compose.ui.text.font.FontWeight\n', 'import androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.text.style.TextAlign\n')
          if 'import androidx.compose.ui.unit.LayoutDirection' not in s:
              s = s.replace('import androidx.compose.ui.unit.dp\n', 'import androidx.compose.ui.unit.LayoutDirection\nimport androidx.compose.ui.unit.dp\n')

          old = 'Row(Modifier.horizontalScroll(rememberScrollState()),horizontalArrangement=Arrangement.spacedBy(8.dp)){ listOf("5","8","10","12","16","20","30").forEach{ AssistChip(onClick={vm.update{copy(capacity=it)}},label={Text("$it kW")}) } }'
          new = 'CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr){Row(Modifier.horizontalScroll(rememberScrollState()),horizontalArrangement=Arrangement.spacedBy(8.dp)){ listOf("5","8","10","12","16","20","30").forEach{ AssistChip(onClick={vm.update{copy(capacity=it)}},label={Text("$it kW")}) } }}'
          assert old in s
          s = s.replace(old, new)

          old = '@Composable private fun FormActions(step:Int,lang:String,onSave:()->Unit,onBack:()->Unit,onContinue:()->Unit){Surface(Modifier.imePadding(),shadowElevation=6.dp){Column(Modifier.navigationBarsPadding().padding(12.dp)){OutlinedButton(onSave,Modifier.fillMaxWidth().testTag("save-draft")){Icon(Icons.Outlined.Save,null);Text(tr(lang,"Save Draft","حفظ المسودة","ڕەشنووس پاشەکەوت بکە"))};Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.spacedBy(10.dp)){if(step>1)OutlinedButton(onBack,Modifier.weight(1f)){Text(tr(lang,"Back","رجوع","گەڕانەوە"))};PrimaryButton(if(step==4)tr(lang,"Preview Form","معاينة الاستمارة","پێشبینینی فۆرم")else tr(lang,"Continue","متابعة","بەردەوام بە"),onContinue,Modifier.weight(1f))}}}}'
          new = '@Composable private fun FormActions(step:Int,lang:String,onSave:()->Unit,onBack:()->Unit,onContinue:()->Unit){Surface(Modifier.imePadding(),shadowElevation=6.dp){Column(Modifier.navigationBarsPadding().padding(12.dp)){OutlinedButton(onSave,Modifier.fillMaxWidth().testTag("save-draft")){Icon(Icons.Outlined.Save,null);Text(tr(lang,"Save Draft","حفظ المسودة","ڕەشنووس پاشەکەوت بکە"))};CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr){Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.spacedBy(10.dp)){if(step>1)OutlinedButton(onBack,Modifier.weight(1f)){Text(tr(lang,"Back","رجوع","گەڕانەوە"),textAlign=TextAlign.Center)};PrimaryButton(if(step==4)tr(lang,"Preview Form","معاينة الاستمارة","پێشبینینی فۆرم")else tr(lang,"Continue","متابعة","بەردەوام بە"),onContinue,Modifier.weight(1f))}}}}}'
          assert old in s
          s = s.replace(old, new)

          old = '@Composable private fun Segment(values:List<String>,selected:String,labelFor:(String)->String={it},onSelect:(String)->Unit){SingleChoiceSegmentedButtonRow(Modifier.fillMaxWidth()){values.forEachIndexed{i,v->SegmentedButton(selected==v,{onSelect(v)},SegmentedButtonDefaults.itemShape(i,values.size)){Text(labelFor(v),fontSize=11.sp)}}}}'
          new = '@Composable private fun Segment(values:List<String>,selected:String,labelFor:(String)->String={it},onSelect:(String)->Unit){CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr){SingleChoiceSegmentedButtonRow(Modifier.fillMaxWidth()){values.forEachIndexed{i,v->SegmentedButton(selected==v,{onSelect(v)},SegmentedButtonDefaults.itemShape(i,values.size),Modifier.weight(1f).heightIn(min=48.dp)){Text(labelFor(v),fontSize=10.5.sp,lineHeight=13.sp,maxLines=2,textAlign=TextAlign.Center,modifier=Modifier.fillMaxWidth())}}}}}'
          assert old in s
          s = s.replace(old, new)
          form.write_text(s)

          settings = root/'app/src/main/java/com/infinitygreenpower/organizerform/feature/settings/SettingsScreen.kt'
          s = settings.read_text()
          if 'import androidx.compose.ui.platform.LocalLayoutDirection' not in s:
              s = s.replace('import androidx.compose.ui.platform.LocalContext\n', 'import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.platform.LocalLayoutDirection\n')
          if 'import androidx.compose.ui.text.style.TextAlign' not in s:
              s = s.replace('import androidx.compose.ui.text.font.FontWeight\n', 'import androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.text.style.TextAlign\n')
          if 'import androidx.compose.ui.unit.LayoutDirection' not in s:
              s = s.replace('import androidx.compose.ui.unit.dp\n', 'import androidx.compose.ui.unit.LayoutDirection\nimport androidx.compose.ui.unit.dp\n')

          old = 'SingleChoiceSegmentedButtonRow(Modifier.fillMaxWidth()){listOf("en" to "English","ar" to "العربية","ckb" to "کوردی").forEachIndexed{i,(code,label)->SegmentedButton(s.language==code,{vm.setLanguage(code)},SegmentedButtonDefaults.itemShape(i,3)){Text(label,fontSize=11.sp)}}}'
          new = 'CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr){SingleChoiceSegmentedButtonRow(Modifier.fillMaxWidth()){listOf("en" to "English","ar" to "العربية","ckb" to "کوردی").forEachIndexed{i,(code,label)->SegmentedButton(s.language==code,{vm.setLanguage(code)},SegmentedButtonDefaults.itemShape(i,3),Modifier.weight(1f).heightIn(min=44.dp)){Text(label,fontSize=11.sp,maxLines=1,textAlign=TextAlign.Center,modifier=Modifier.fillMaxWidth())}}}}'
          assert old in s
          settings.write_text(s.replace(old, new))
          PY

          sed -i 's#<string name="app_name">IGP Organizer Form</string>#<string name="app_name">IGP Organizer Form Preview</string>#' "$SRC/main/res/values/strings.xml"
          sed -i 's#<string name="app_name">استمارة منظم IGP</string>#<string name="app_name">استمارة منظم IGP - تجريبي</string>#' "$SRC/main/res/values-ar/strings.xml"
          sed -i 's#<string name="app_name">فۆرمی ڕێکخەری IGP</string>#<string name="app_name">فۆرمی ڕێکخەری IGP - تاقیکردنەوە</string>#' "$SRC/main/res/values-b+ckb/strings.xml"
          cat build-input/v5_language_fix/preview-test-keystore.b64 | base64 -d > /tmp/igp-preview-test.jks

          BUILD=/tmp/igp-build/IGP/app/build.gradle.kts
          FORM="$SRC/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt"
          SETTINGS="$SRC/main/java/com/infinitygreenpower/organizerform/feature/settings/SettingsScreen.kt"
          test "$(sha256sum "$BUILD" | awk '{print $1}')" = "604bf8be24417112b80d14f2f64832b3836691fc13784f99d6dbb8ab5adee5e1"
          test "$(sha256sum "$FORM" | awk '{print $1}')" = "cf55c829c6aed87e9c3ea7ef9941af4bca6ef7b2ba5976a699c36e700a2a8791"
          test "$(sha256sum "$SETTINGS" | awk '{print $1}')" = "849596bafc27b853e2068597c874be5f7151a840d7bf8e0f20f16b6a2f054ae2"
          grep -q 'applicationIdSuffix = ".preview"' "$BUILD"
          grep -q 'versionCode = 39' "$BUILD"
          grep -q 'versionName = "5.0.0-rc5"' "$BUILD"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build RC5 preview APK
        working-directory: /tmp/igp-build/IGP
        shell: bash
        env:
          IGP_PREVIEW_KEYSTORE: /tmp/igp-preview-test.jks
          IGP_PREVIEW_STORE_PASSWORD: IGPPreview2026!
          IGP_PREVIEW_KEY_ALIAS: igp-preview
          IGP_PREVIEW_KEY_PASSWORD: IGPPreview2026!
        run: gradle --no-daemon clean assembleDebug

      - name: Verify update identity and APK
        shell: bash
        run: |
          APK=/tmp/igp-build/IGP/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK" && test -x "$AAPT" && test -x "$APKSIGNER"
          BADGING=$("$AAPT" dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep "name='com.infinitygreenpower.offerstudio.preview'"
          echo "$BADGING" | grep "versionCode='39'"
          echo "$BADGING" | grep "versionName='5.0.0-rc5-test'"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/signing.txt
          grep -qi '1f83a683d692d6530df5ba8e4ba1892e18bb11a313c5f744b464f3bf003c06f0' /tmp/signing.txt
          unzip -t "$APK" >/dev/null
          cp "$APK" IGP-Organizer-Form-5.0.0-rc5-RTL-Control-Fix.apk
          sha256sum IGP-Organizer-Form-5.0.0-rc5-RTL-Control-Fix.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc5-RTL-Control-Fix-APK
          path: IGP-Organizer-Form-5.0.0-rc5-RTL-Control-Fix.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to build branch
        shell: bash
        run: |
          mkdir -p build-output
          cp IGP-Organizer-Form-5.0.0-rc5-RTL-Control-Fix.apk build-output/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/IGP-Organizer-Form-5.0.0-rc5-RTL-Control-Fix.apk
          git commit -m "Build v5.0.0-rc5 RTL control fix APK" || exit 0
          git push
