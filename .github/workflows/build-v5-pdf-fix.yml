name: Build v5 PDF Fix APK

on:
  push:
    branches:
      - chatgpt-v5-pdf-fix-build
    paths:
      - '.github/workflows/build-v5-pdf-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify rc2 PDF-fixed source
        shell: bash
        run: |
          cat build-input/v5_pdf_fix/source.b64.part* | base64 -d > /tmp/igp-source.zip
          mkdir -p /tmp/igp-build
          unzip -q /tmp/igp-source.zip -d /tmp/igp-build || true

          SRC=/tmp/igp-build/IGP/app/src
          mkdir -p "$SRC/main"
          for DIR in java res assets; do
            if [ -d "$SRC/$DIR" ]; then
              cp -a "$SRC/$DIR" "$SRC/main/"
            fi
          done
          if [ -f "$SRC/AndroidManifest.xml" ]; then
            cp "$SRC/AndroidManifest.xml" "$SRC/main/AndroidManifest.xml"
          fi

          cp build-input/v5_pdf_fix/Relations.kt "$SRC/main/java/com/infinitygreenpower/organizerform/data/db/Relations.kt"

          BUILD=/tmp/igp-build/IGP/app/build.gradle.kts
          PDF="$SRC/main/java/com/infinitygreenpower/organizerform/export/pdf/PdfExporter.kt"
          test -f "$BUILD"
          test -f "$SRC/main/AndroidManifest.xml"
          test -f "$PDF"

          # Make this a real new test version so Android/About clearly distinguishes it.
          sed -i 's/versionCode = 35/versionCode = 36/' "$BUILD"
          sed -i 's/versionName = "5.0.0-rc1"/versionName = "5.0.0-rc2"/' "$BUILD"
          grep -nE 'versionCode|versionName|versionNameSuffix' "$BUILD"

          # Fail the build if the verified PDF-fixed exporter is not the source being compiled.
          PDF_SHA=$(sha256sum "$PDF" | awk '{print $1}')
          echo "PdfExporter SHA-256: $PDF_SHA"
          test "$PDF_SHA" = "54fe417288001ae1349540eee7f63705ca119ac2b215138507cb0f814247d864"
          test "$(wc -l < "$PDF")" -ge 600

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        working-directory: /tmp/igp-build/IGP
        shell: bash
        run: gradle --no-daemon clean assembleDebug

      - name: Verify and rename APK
        shell: bash
        run: |
          APK=/tmp/igp-build/IGP/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" IGP-Organizer-Form-5.0.0-rc2-PDF-fix-test.apk
          sha256sum IGP-Organizer-Form-5.0.0-rc2-PDF-fix-test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc2-PDF-fix-test-APK
          path: IGP-Organizer-Form-5.0.0-rc2-PDF-fix-test.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to build branch
        shell: bash
        run: |
          mkdir -p build-output
          cp IGP-Organizer-Form-5.0.0-rc2-PDF-fix-test.apk build-output/
          rm -f build-output/v5-build-errors.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output
          git commit -m "Build v5.0.0-rc2 PDF-fix test APK" || exit 0
          git push
