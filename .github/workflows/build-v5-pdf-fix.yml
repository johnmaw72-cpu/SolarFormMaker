name: Build v5 PDF Fix APK

on:
  push:
    branches:
      - chatgpt-v5-pdf-fix-build
    paths:
      - '.github/workflows/build-v5-pdf-fix.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v5 PDF-fixed source
        shell: bash
        run: |
          cat build-input/v5_pdf_fix/source.b64.part* | base64 -d > /tmp/igp-source.zip
          mkdir -p /tmp/igp-build
          unzip -q /tmp/igp-source.zip -d /tmp/igp-build
          test -f /tmp/igp-build/IGP/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        working-directory: /tmp/igp-build/IGP
        shell: bash
        run: gradle --no-daemon clean assembleDebug

      - name: Verify and rename APK
        shell: bash
        run: |
          APK=/tmp/igp-build/IGP/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" IGP-Organizer-Form-5.0.0-rc1-PDF-fix-test.apk
          sha256sum IGP-Organizer-Form-5.0.0-rc1-PDF-fix-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc1-PDF-fix-test-APK
          path: IGP-Organizer-Form-5.0.0-rc1-PDF-fix-test.apk
          if-no-files-found: error
          retention-days: 7
