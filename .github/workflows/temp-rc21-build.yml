name: Temporary RC21 Required Fields and Item Dialog Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-rc21:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact RC20 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lines = Path('.github/workflows/temp-rc20-build.yml').read_text().splitlines()
          for name in ['Reconstruct exact RC19 source','Apply RC20 single-form builder patch']:
              start = next(i for i,l in enumerate(lines) if l.strip() == f'- name: {name}')
              run = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
              body=[]
              for line in lines[run+1:]:
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  body.append(line[10:] if line.startswith('          ') else line)
              p=Path('/tmp')/(name.replace(' ','_')+'.sh')
              p.write_text('\n'.join(body).rstrip()+'\n')
              subprocess.run(['bash',str(p)],check=True)
          PY
          grep -Fq 'versionCode = 54' /tmp/igp-build/IGP/app/build.gradle.kts
          grep -Fq 'versionName = "5.0.0-rc20"' /tmp/igp-build/IGP/app/build.gradle.kts

      - name: Apply RC21 quantity price and required fields patch
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/igp-build/IGP
          cat build-input/rc21_required_item_dialog/part*.txt > /tmp/rc21.patch.gz.b64
          base64 -d /tmp/rc21.patch.gz.b64 > /tmp/rc21.patch.gz
          echo '8feefa1d5b289c0ade5b6db96c4bd7333a483cde43b21c31a4747fa59f1bea0c  /tmp/rc21.patch.gz' | sha256sum -c -
          gzip -dc /tmp/rc21.patch.gz > /tmp/rc21.patch
          echo '55ef1f5a619017a5e159a4fc639d5f87c1c931ccad5bb94e9716e76752aa52a8  /tmp/rc21.patch' | sha256sum -c -
          cd "$ROOT"
          patch -p2 < /tmp/rc21.patch
          grep -Fq 'versionCode = 55' app/build.gradle.kts
          grep -Fq 'versionName = "5.0.0-rc21"' app/build.gradle.kts
          grep -Fq 'var pendingAdd by remember { mutableStateOf<CatalogItemEntity?>(null) }' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt
          grep -Fq 'Tap + beside an item, then enter its quantity and unit price before adding it.' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt
          grep -Fq 'Red fields are required. Fill them before preparing/saving the final PDF.' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt
          grep -Fq 'PdfRequiredHighlights' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt
          grep -Fq 'Save is locked until the red required fields are completed.' app/src/main/java/com/infinitygreenpower/organizerform/feature/form/FormScreen.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Prepare RC20-compatible preview signing
        shell: bash
        run: |
          set -euo pipefail
          base64 -d build-input/v5_language_fix/preview-test-keystore.b64 > /tmp/igp-preview-test.jks
          RC16=.github/workflows/temp-rc16-build.yml
          echo "IGP_PREVIEW_KEYSTORE=/tmp/igp-preview-test.jks" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_STORE_PASSWORD=$(awk -F': ' '/IGP_PREVIEW_STORE_PASSWORD:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_KEY_ALIAS=$(awk -F': ' '/IGP_PREVIEW_KEY_ALIAS:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"
          echo "IGP_PREVIEW_KEY_PASSWORD=$(awk -F': ' '/IGP_PREVIEW_KEY_PASSWORD:/{print $2; exit}' "$RC16")" >> "$GITHUB_ENV"

      - name: Build RC21 APK
        working-directory: /tmp/igp-build/IGP
        run: gradle --no-daemon clean assembleDebug

      - name: Verify and stage RC21 APK and source
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/igp-build/IGP/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "package: name='com.infinitygreenpower.offerstudio.preview' versionCode='55' versionName='5.0.0-rc21-test'" /tmp/badging.txt
          cp "$APK" "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc21-Required-Fields-Item-Dialog.apk"
          cd /tmp/igp-build
          find IGP -type d \( -name build -o -name .gradle \) -prune -exec rm -rf {} + || true
          zip -qr "$GITHUB_WORKSPACE/IGP-Organizer-Form-5.0.0-rc21-source.zip" IGP
          cd "$GITHUB_WORKSPACE"
          sha256sum IGP-Organizer-Form-5.0.0-rc21-Required-Fields-Item-Dialog.apk IGP-Organizer-Form-5.0.0-rc21-source.zip

      - uses: actions/upload-artifact@v4
        with:
          name: IGP-Organizer-Form-5.0.0-rc21-APK-and-Source
          path: |
            IGP-Organizer-Form-5.0.0-rc21-Required-Fields-Item-Dialog.apk
            IGP-Organizer-Form-5.0.0-rc21-source.zip
          if-no-files-found: error
          retention-days: 7
